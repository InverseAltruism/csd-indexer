  /* The tokens this page reads, for a direct indexer hit where /ui/tokens.css is absent (light only). Through the front
     door tokens.css follows in the same layer and wins, in both themes. The only colour literals of the page. */
  @layer tokens, base, components, page;
  @layer tokens {
    :root {
      color-scheme: light;
      --ui-font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --ui-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --ui-text-2xs: 11px; --ui-text-xs: 13px; --ui-text-sm: 14px; --ui-text-md: 16px; --ui-text-lg: 18px; --ui-text-xl: 22px;
      --ui-text-2xl: 28px;
      --ui-leading-tight: 1.1; --ui-leading-snug: 1.3; --ui-leading-body: 1.55;
      --ui-track-heading: -0.03em; --ui-track-snug: -0.015em; --ui-track-label: 0.08em;
      --ui-space-1: 4px; --ui-space-2: 8px; --ui-space-3: 12px; --ui-space-4: 16px; --ui-space-5: 24px; --ui-space-6: 32px;
      --ui-space-7: 48px; --ui-space-8: 64px;
      --ui-radius-sm: 6px; --ui-radius-md: 10px; --ui-radius-lg: 14px; --ui-radius-pill: 999px;
      --ui-ease: cubic-bezier(0.16, 1, 0.3, 1); --ui-ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --ui-dur-1: 120ms; --ui-dur-2: 200ms; --ui-dur-3: 320ms; --ui-dur-4: 460ms;
      --ui-bg: #F4F4F1; --ui-surface: #FFFFFF; --ui-sunken: #EBEBE7; --ui-line: #E0E0DB; --ui-line-2: #C9C9C3;
      --ui-line-strong: #8A8A85; --ui-muted: #686864; --ui-ink-2: #3B3B38; --ui-ink: #0C0C0B; --ui-on-ink: #FFFFFF;
      --ui-up: #0A6B3D; --ui-down: #AB3027; --ui-warn: #895100;
      --ui-up-tint: rgba(10, 107, 61, 0.12); --ui-down-tint: rgba(171, 48, 39, 0.12); --ui-warn-tint: rgba(137, 81, 0, 0.12);
      --ui-shadow-1: 0 1px 2px rgba(12, 12, 11, 0.06);
    }
  }

<style>
@layer page {
  /* Measured against the approved preview's #explorer. Raw px below: hairlines (1px), the focus ring and nudges (2px), and
     the preview's layout widths (the key column, the content measure, field and card minimums). Sizes the token scale
     lacks take the nearest token and are listed as token additions in the wave report. */
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  /* clip, not hidden: clip makes no scroll container, so the site header's position:sticky keeps working */
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--ui-bg); color: var(--ui-ink); font: 400 var(--ui-text-md) / var(--ui-leading-body) var(--ui-font-sans);
    -webkit-font-smoothing: antialiased; }
  a { color: var(--ui-ink); text-decoration: none; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--ui-ink); outline-offset: 2px; border-radius: var(--ui-radius-sm); }
  b { font-weight: 500; }
  svg.i { width: var(--ui-text-lg); height: var(--ui-text-lg); flex: none; fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round; }
  /* mono only for hashes, addresses, heights and amounts in tables */
  .mono, .num { font-family: var(--ui-font-mono); font-size: var(--ui-text-xs); }
  .num { font-variant-numeric: tabular-nums; }
  .num { text-align: right; }
  .dim, .muted { color: var(--ui-muted); }
  .green { color: var(--ui-up); }
  .red { color: var(--ui-down); }
  .amber { color: var(--ui-warn); }
  /* a hash's 0x and leading zeros: colour only, the hash stays whole and selectable */
  .lz { color: var(--ui-muted); }
  /* an address in groups of four, by spacing only: a copy of it carries no spaces */
  .g4 + .g4, .g4 + .gx, .gx + .g4 { margin-left: 0.4em; }

  /* standalone: cairn's header.js is absent and #site-header keeps this page's own brand line */
  #site-header:empty { display: none; }
  #site-header:has(> .ex-brand) { display: flex; align-items: center; min-height: var(--ui-space-7);
    padding: 0 clamp(var(--ui-space-4), 4vw, var(--ui-space-6)); border-bottom: 1px solid var(--ui-line); }
  .ex-brand { font-weight: 600; letter-spacing: var(--ui-track-snug); }

  /* 1200 px: the content measure the site's other pages use */
  .ex-wrap { max-width: 1200px; margin: 0 auto; }
  .ex-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ui-space-4); padding: var(--ui-space-4) var(--ui-space-5);
    border-bottom: 1px solid var(--ui-line); }
  form.search { flex: 1 1 420px; min-width: 0; display: flex; align-items: center; gap: var(--ui-space-2); height: var(--ui-space-7);
    padding: 0 var(--ui-space-3); border: 1px solid var(--ui-line); border-radius: var(--ui-radius-md); background: var(--ui-surface);
    transition: border-color var(--ui-dur-2) var(--ui-ease), box-shadow var(--ui-dur-2) var(--ui-ease); }
  form.search > svg.i { color: var(--ui-muted); }
  form.search:focus-within { border-color: var(--ui-ink); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ui-ink) 10%, transparent); }
  form.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ui-ink); font: inherit;
    font-size: var(--ui-text-md); }
  form.search input::placeholder { color: var(--ui-muted); }
  .kbd { padding: 2px var(--ui-space-1); border: 1px solid var(--ui-line-2); border-bottom-width: 2px; border-radius: var(--ui-radius-sm);
    color: var(--ui-muted); font: 500 var(--ui-text-2xs) var(--ui-font-mono); }
  .stats { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ui-space-1) var(--ui-space-4); color: var(--ui-muted);
    font-size: var(--ui-text-xs); line-height: var(--ui-leading-snug); }
  .stats b { color: var(--ui-ink-2); font-weight: 500; font-variant-numeric: tabular-nums; }
  /* components.css sizes .ui-dot for a flex badge; in running text it needs a box of its own */
  .ui-dot { display: inline-block; vertical-align: 1px; }
  .stats .ui-dot, .pill .ui-dot { margin-right: var(--ui-space-1); }

  main { padding-bottom: var(--ui-space-6); }
  #view > :first-child { border-top: 0; }
  .panel { position: relative; min-width: 0; padding: var(--ui-space-5); border-top: 1px solid var(--ui-line); }
  /* a table runs to the panel's edges; its cells carry the inset */
  .panel > .scroll-x { margin-inline: calc(-1 * var(--ui-space-5)); }
  h2 { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ui-space-2); margin: 0 0 var(--ui-space-3); color: var(--ui-ink);
    font: 500 var(--ui-text-md) / var(--ui-leading-body) var(--ui-font-sans); letter-spacing: normal; }
  h2.ex-title { gap: var(--ui-space-3); margin-bottom: var(--ui-space-2); font-size: var(--ui-text-xl); letter-spacing: var(--ui-track-snug); }
  h2.ex-title .badge, h2 .badge { letter-spacing: normal; }
  .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row > .panel + .panel { border-left: 1px solid var(--ui-line); }

  /* the chain at a glance: label over value, split by hairlines */
  .pulse { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--ui-line); }
  .pu { min-width: 0; padding: var(--ui-space-4) var(--ui-space-5); border-right: 1px solid var(--ui-line); }
  .pu:last-child { border-right: 0; }
  .pu .l { display: inline-block; color: var(--ui-muted); font: 500 var(--ui-text-2xs) / var(--ui-leading-body) var(--ui-font-mono);
    letter-spacing: var(--ui-track-label); text-transform: uppercase; }
  .pu .n { margin-top: var(--ui-space-1); font: 500 var(--ui-text-xl) / var(--ui-leading-snug) var(--ui-font-sans); letter-spacing: var(--ui-track-snug);
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  /* latest blocks and the CairnX activity, side by side */
  .ex-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--ui-line); }
  .ex-col { min-width: 0; padding: 0; border-top: 0; }
  .ex-col + .ex-col { border-left: 1px solid var(--ui-line); }
  .ex-col > h2 { justify-content: space-between; margin: 0; padding: var(--ui-space-4) var(--ui-space-5) var(--ui-space-1); }
  .ex-col > .scroll-x { margin: 0; }
  .ex-col > .tabs, .ex-col > #actmore { margin-inline: var(--ui-space-5); }
  .ex-col > #actmore { padding-bottom: var(--ui-space-4); }
  .ex-cols + .panel { border-top: 0; }

  .figs { display: flex; flex-wrap: wrap; gap: var(--ui-space-2) var(--ui-space-5); margin-bottom: var(--ui-space-3); color: var(--ui-muted);
    font-size: var(--ui-text-sm); }
  .figs b { color: var(--ui-ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .bar { height: var(--ui-space-1); overflow: hidden; border-radius: var(--ui-radius-pill); background: var(--ui-sunken); }
  .bar i { display: block; height: 100%; background: var(--ui-ink); }

  .coins { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--ui-space-3); }
  .coin { display: block; padding: var(--ui-space-4); border: 1px solid var(--ui-line); border-radius: var(--ui-radius-lg); background: var(--ui-surface);
    color: inherit; transition: border-color var(--ui-dur-2) var(--ui-ease); }
  .coin:hover { border-color: var(--ui-line-2); text-decoration: none; }
  .coin .tk { font-weight: 600; }
  .coin .nm { margin-left: var(--ui-space-2); color: var(--ui-muted); font-size: var(--ui-text-xs); }
  .coin .meta { display: flex; flex-wrap: wrap; gap: var(--ui-space-1) var(--ui-space-4); margin: var(--ui-space-2) 0 var(--ui-space-3); color: var(--ui-muted);
    font-size: var(--ui-text-xs); }
  .coin .meta b { color: var(--ui-ink); font-weight: 500; font-variant-numeric: tabular-nums; }

  /* tables read like a ledger */
  table { width: 100%; border-collapse: collapse; font-size: var(--ui-text-sm); line-height: normal; }
  th { padding: var(--ui-space-3) var(--ui-space-5) var(--ui-space-2); border-bottom: 1px solid var(--ui-line); color: var(--ui-muted); text-align: left;
    font: 500 var(--ui-text-2xs) / var(--ui-leading-snug) var(--ui-font-mono); letter-spacing: var(--ui-track-label); text-transform: uppercase; white-space: nowrap; }
  td { padding: var(--ui-space-3) var(--ui-space-5); border-bottom: 1px solid var(--ui-line); text-align: left; white-space: nowrap; vertical-align: baseline; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background var(--ui-dur-1); }
  tbody tr:hover { background: var(--ui-sunken); }
  th.num { font-size: var(--ui-text-2xs); }
  th.num:first-child, td.num:first-child { width: 1%; }
  td.act { min-width: 260px; white-space: normal; overflow-wrap: anywhere; }
  .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* key and value: the preview's 120 px key column */
  .kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: var(--ui-space-2) var(--ui-space-4); align-items: baseline; min-width: 0;
    font-size: var(--ui-text-sm); }
  .kv > div:nth-child(odd) { color: var(--ui-muted); font-size: var(--ui-text-xs); }
  .kv > div:nth-child(odd)::first-letter { text-transform: uppercase; }
  .kv > .v { min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .ex-detail { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ui-space-2) var(--ui-space-7); margin-top: var(--ui-space-4); }
  .copy { display: inline-grid; place-items: center; width: var(--ui-space-5); height: var(--ui-space-5); margin-left: var(--ui-space-1); padding: 0;
    border: 0; border-radius: var(--ui-radius-sm); background: transparent; color: var(--ui-muted); vertical-align: middle; cursor: pointer;
    transition: background var(--ui-dur-1), color var(--ui-dur-1); }
  .copy:hover { background: var(--ui-sunken); color: var(--ui-ink); }
  .copy svg.i { width: var(--ui-text-sm); height: var(--ui-text-sm); }
  .copy.done { color: var(--ui-up); }

  /* the family label of a record */
  .kind { display: inline-flex; align-items: center; justify-content: center; min-width: var(--ui-space-8); margin-right: var(--ui-space-1);
    height: calc(var(--ui-text-2xs) * 2); padding: 0 var(--ui-space-2); border-radius: var(--ui-radius-sm); background: var(--ui-sunken); color: var(--ui-ink-2);
    font: 500 var(--ui-text-2xs) var(--ui-font-sans); vertical-align: 1px; text-decoration: none; white-space: nowrap; }
  .chip, .pill { display: inline-block; padding: 0 var(--ui-space-2); border: 1px solid var(--ui-line); border-radius: var(--ui-radius-sm);
    color: var(--ui-muted); font: 500 var(--ui-text-2xs) / 1.7 var(--ui-font-mono); white-space: nowrap; vertical-align: 1px; }
  .chip { margin-left: var(--ui-space-1); }
  .badge { display: inline-flex; align-items: center; gap: var(--ui-space-1); height: var(--ui-space-5); padding: 0 var(--ui-space-2);
    border: 1px solid var(--ui-line); border-radius: var(--ui-radius-pill); background: var(--ui-surface); color: var(--ui-ink-2);
    font: 500 var(--ui-text-2xs) / 1 var(--ui-font-sans); white-space: nowrap; }
  .badge svg.i { width: var(--ui-text-xs); height: var(--ui-text-xs); stroke-width: 2; }
  .badge.ok { border-color: color-mix(in oklab, var(--ui-up) 35%, var(--ui-line)); background: var(--ui-up-tint); color: var(--ui-up); }
  .badge.bad { border-color: color-mix(in oklab, var(--ui-down) 35%, var(--ui-line)); background: var(--ui-down-tint); color: var(--ui-down); }

  .action { padding: 0 0 var(--ui-space-3); font-size: var(--ui-text-md); line-height: var(--ui-leading-body); }
  .action .what { color: var(--ui-ink); }
  /* an amount or a name in a record line stays on one line: a break inside a number reads as two numbers */
  .action b, td.act b { white-space: nowrap; }
  /* a CairnX record the resolver refused: struck and tagged "no effect", so it never reads as an effect */
  .cx-void { color: var(--ui-muted); text-decoration: line-through; text-decoration-color: var(--ui-down); }
  .cx-void .what, .cx-void b, .cx-void a { color: inherit; }
  .cx-noeffect { display: inline-block; margin-left: var(--ui-space-1); padding: 0 var(--ui-space-2); border-radius: var(--ui-radius-sm);
    background: var(--ui-down-tint); color: var(--ui-down); font: 500 var(--ui-text-2xs) / 1.8 var(--ui-font-sans); text-decoration: none;
    vertical-align: 1px; cursor: help; white-space: nowrap; }
  .flow { display: flex; flex-wrap: wrap; gap: var(--ui-space-2) var(--ui-space-5); padding: var(--ui-space-1) 0 0; color: var(--ui-muted);
    font-size: var(--ui-text-sm); }
  .flow b { color: var(--ui-ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .flow .out b { color: var(--ui-down); }
  .flow .in b { color: var(--ui-up); }
  .muted { font-size: var(--ui-text-xs); }
  div.muted { margin-top: var(--ui-space-3); max-width: 80ch; }
  div.muted + .kv, div.muted + .scroll-x { margin-top: var(--ui-space-4); }
  div.muted a { text-decoration: underline; text-decoration-color: var(--ui-line-strong); }
  .cxbal { display: flex; flex-wrap: wrap; gap: var(--ui-space-2); margin-top: var(--ui-space-4); }
  .cxbal .tk, .cxbal .nm { padding: var(--ui-space-1) var(--ui-space-3); border: 1px solid var(--ui-line); border-radius: var(--ui-radius-md);
    font-size: var(--ui-text-sm); }
  .cxbal .tk b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .addrl.hasname { font-weight: 500; }

  .namehdr { display: flex; align-items: center; gap: var(--ui-space-4); }
  .namehdr h2.ex-title { margin: 0; }
  /* an identity avatar, the one coloured element: its hue from the name (--hue), its lightness from the theme */
  .navatar { display: inline-grid; place-items: center; flex: none; width: var(--ui-space-7); height: var(--ui-space-7); border: 1px solid;
    border-radius: var(--ui-radius-lg); font: 600 var(--ui-text-xl) / 1 var(--ui-font-sans);
    background: hsl(var(--hue) 45% 88%); border-color: hsl(var(--hue) 35% 72%); color: hsl(var(--hue) 55% 24%); }
  :root[data-theme="dark"] .navatar { background: hsl(var(--hue) 40% 18%); border-color: hsl(var(--hue) 40% 34%); color: hsl(var(--hue) 60% 86%); }

  /* filter tabs: the segmented control's look; the inset is that of components.css .ui-seg */
  .tabs { display: inline-flex; gap: 2px; margin: 0 0 var(--ui-space-3); padding: 2px; border: 1px solid var(--ui-line); border-radius: var(--ui-radius-pill);
    background: var(--ui-sunken); }
  .tab { padding: var(--ui-space-1) var(--ui-space-3); border: 0; border-radius: var(--ui-radius-pill); background: transparent; color: var(--ui-muted);
    font: 500 var(--ui-text-xs) / var(--ui-leading-snug) var(--ui-font-sans); cursor: pointer;
    transition: color var(--ui-dur-1) var(--ui-ease), background-color var(--ui-dur-2) var(--ui-ease); }
  .tab:hover { color: var(--ui-ink); }
  .tab.on { background: var(--ui-surface); color: var(--ui-ink); box-shadow: var(--ui-shadow-1), 0 0 0 1px var(--ui-line); }
  .ex-btn { display: inline-flex; align-items: center; min-height: var(--ui-space-6); margin-top: var(--ui-space-3); padding: 0 var(--ui-space-3);
    border: 1px solid var(--ui-line-2); border-radius: var(--ui-radius-pill); background: var(--ui-surface); color: var(--ui-ink);
    font: 500 var(--ui-text-xs) / 1 var(--ui-font-sans); cursor: pointer; transition: border-color var(--ui-dur-2) var(--ui-ease), transform var(--ui-dur-1) var(--ui-ease); }
  .ex-btn:hover:not(:disabled) { border-color: var(--ui-ink); }
  .ex-btn:active:not(:disabled) { transform: scale(0.97); }
  .ex-btn:disabled { color: var(--ui-muted); cursor: progress; }
  .tok-search { width: 100%; margin-top: var(--ui-space-3); padding: var(--ui-space-2) var(--ui-space-3); border: 1px solid var(--ui-line);
    border-radius: var(--ui-radius-md); background: var(--ui-surface); color: var(--ui-ink); font: 400 var(--ui-text-md) var(--ui-font-sans); }
  .tok-search:focus { outline: 0; border-color: var(--ui-ink); }

  .actrow { display: flex; justify-content: space-between; align-items: baseline; gap: var(--ui-space-4); padding: var(--ui-space-3) var(--ui-space-5);
    border-bottom: 1px solid var(--ui-line); font-size: var(--ui-text-sm); transition: background var(--ui-dur-1); }
  .actrow:hover { background: var(--ui-sunken); }
  .actrow:last-child { border-bottom: 0; }
  .actrow > .action { min-width: 0; padding: 0; font-size: var(--ui-text-sm); overflow-wrap: anywhere; }
  .actrow .meta { flex: none; color: var(--ui-muted); font-size: var(--ui-text-xs); text-align: right; white-space: nowrap; }
  .actrow .meta a { color: var(--ui-muted); }
  .actrow .meta .addrl.hasname { font-weight: 400; }
  .ex-col .actrow { flex-direction: column; gap: var(--ui-space-1); }
  .ex-col .actrow .meta { text-align: left; white-space: normal; }

  .loading { padding: var(--ui-space-5); color: var(--ui-muted); }
  /* loading is live state: the skeleton may pulse */
  .skel { height: var(--ui-space-3); margin: var(--ui-space-3) 0; border-radius: var(--ui-radius-sm); background: var(--ui-sunken);
    animation: ex-skel calc(var(--ui-dur-4) * 3) var(--ui-ease-in-out) infinite alternate; }
  @keyframes ex-skel { to { opacity: 0.45; } }
  /* a block that arrived while the page was open drops in at the top of the list, once */
  .feed-row { animation: ex-row-in var(--ui-dur-4) var(--ui-ease) both; }

<script>

const ICON={ copy:'<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="3"/><path d="M16 8V6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v7a3 3 0 0 0 3 3h2"/></svg>',

//    indexer's own header, NOT a trustless proof (no PoW/checkpoint verification here). ──

// ── router ──

async function route(){

function doSearch(e){e.preventDefault();let q=$('#q').value.trim();if(!q)return false;

let DEC=null, GATES=null;

// CairnX VERDICT map (txid → {applied, note}) for the records a view shows, read fresh per view (verdicts change as

// supply, mint by a non-issuer, deploy with an unpaid fee, an underfunded transfer…) had NO on-chain effect, instead

// Wrap a decoded record line with its resolver verdict. A refused record is struck through and

function cxVerdict(body,verdict){

// payment flow of a tx, from the signer's perspective (single-signer chain: signer pays all inputs)
function flowHtml(tx){
  const me=(tx.signer||'').toLowerCase();

    if((o.addr||'').toLowerCase()===me) change+=o.value;
    else { toOthers+=o.value; outs.push(o); }
  }
  const parts=[];
  if(tx.coinbase) parts.push(`<span class="f in">mined <b>+${fmtCSD((tx.outputs||[]).reduce((s,o)=>s+o.value,0))}</b> (block reward)</span>`);

    if(outs.length) parts.push(`<span class="f out">sent <b>−${fmtCSD(toOthers)}</b> ${outs.length===1?`to ${addrLink(outs[0].addr)}`:`to ${outs.length} recipients`}</span>`);

function blockRow(b,live){
  if(b.time) TIP_TIME=Math.max(TIP_TIME,b.time);   // keep the age reference current with the chain tip
  return el(`<tr class="${live?'feed-row':''}" data-h="${b.height}" data-hash="${b.hash}"><td class="mono">${link('/block/'+b.height,fmtInt(b.height))}</td>
    <td class="dim" data-ts="${b.time||''}" title="${b.time?fmtDate(b.time):''}">${age(b.time)}</td><td class="mono">${blockLead(b.hash)}</td><td class="num">${fmtInt(b.tx_count)}</td></tr>`);
}
async function recentBlocks(){
  // one round-trip (newest-first); 31 blocks feed the block list (12 shown), the emission chart's
  // newest block AND the block-times chart from a single fetch
  try{ const r=await j('/blocks/recent?limit=31'); if(Array.isArray(r)) return r; }catch{ /* no /blocks/recent on this indexer: the per-block reads below */ }
  // fallback for an indexer without /blocks/recent (older deploy / different host)
  const tip=await j('/blocks/tip/height');const out=[];
  for(let h=tip;h>tip-12&&h>=0;h--){const hash=await j('/block-height/'+h).catch(()=>null);if(!hash)continue;out.push(await j('/block/'+hash));}
  return out;
}
function subscribeBlocks(tb){
  // Auto-refresh by POLLING /blocks/recent (real timestamps, deduped by height). This works regardless of
  // SSE / the front-door proxy, which does NOT forward the event-stream: the old EventSource-only feed
  // therefore never updated through cairn-subst.com/explorer, and it stamped streamed rows with the CLIENT
  // clock (Date.now()) so every live block read "0s ago". SSE, when reachable (standalone), just nudges a poll.
  const seen=new Map(); tb.querySelectorAll('[data-h]').forEach(r=>seen.set(+r.getAttribute('data-h'), r.getAttribute('data-hash')||''));
  let es=null,last=0;
  async function poll(){
    if(!tb.isConnected){ clearInterval(iv); try{es&&es.close();}catch{ /* already closed */ } return; }   // view navigated away → stop
    const now=Date.now(); if(now-last<1500) return; last=now;                        // debounce SSE bursts
    let rows; try{ rows=await j('/blocks/recent?limit=12'); }catch{ return; }
    if(!Array.isArray(rows)) return;
    // NEW or CHANGED-hash (reorg) blocks, keyed on height+hash; oldest-first so prepends keep order
    const fresh=rows.filter(b=>b&&seen.get(b.height)!==b.hash).sort((a,c)=>a.height-c.height);
    for(const b of fresh){ const existing=tb.querySelector(`tr[data-h="${b.height}"]`); const nr=blockRow(b,true);
      if(existing){ existing.replaceWith(nr); }                                       // reorg: replace the orphaned row in place
      else { tb.prepend(nr); const hn=$('.pu.hot .n'); if(hn) hn.textContent=fmtInt(b.height); }   // new: prepend + keep the hero height live
      seen.set(b.height, b.hash); }
    while(tb.children.length>14){ const lc=tb.lastChild; seen.delete(+lc.getAttribute('data-h')); tb.removeChild(lc); }
    if(fresh.length) document.querySelectorAll('[data-ts]').forEach(e=>{const t=+e.getAttribute('data-ts'); if(t)e.textContent=age(t);}); // re-age with the advanced TIP_TIME
  }
  const iv=setInterval(poll,12000);
  try{ es=new EventSource(API+'/stream/blocks');
    es.addEventListener('block',()=>poll());
    es.addEventListener('reorg',ev=>{try{const d=JSON.parse(ev.data);const p=$('#livepill');if(p){p.textContent='reorg at block '+fmtInt(d.ancestor);p.classList.add('red');}}catch{ /* a malformed reorg event: the poll below still replaces the rows */ }});
  }catch{ /* no EventSource here: the 12 s poll keeps the feed current */ }
}

async function txPage(v,id){
  await warmCx();
  const [tx,status,proof]=await Promise.all([j('/tx/'+id),j('/tx/'+id+'/status').catch(()=>null),j('/tx/'+id+'/merkle-proof').catch(()=>null)]);
  v.innerHTML='';
  const typeBadge = tx.app_type==='Propose'?'<span class="pill">Propose</span>':tx.app_type==='Attest'?'<span class="pill">Attest</span>':tx.coinbase?'<span class="pill">coinbase</span>':'<span class="pill">transfer</span>';

  // ── what happened, in human terms ──
  const human=el(`<div class="panel"><h2>What happened</h2><div class="action" id="txaction"><span class="dim">decoding…</span></div>${flowHtml(tx)}</div>`);
  v.appendChild(human);
  (async()=>{
    const slot=$('#txaction',human);
    let line=null;
    if(tx.app_type==='Propose'){
      const prop=await j('/proposal/'+tx.txid).catch(()=>null);
      // precise per-record verdict for the detail page (authoritative even past a bounded log page)
      const vr=await jx(SIB.cairnx,'/record/'+tx.txid).catch(()=>null);
      const verdict=vr&&typeof vr.applied==='boolean'?vr:null;
      if(prop) line=describeDomainRecord(prop.domain,prop.uri,verdict,prop.height)
        || `${kind('Record')}<span class="what">Anchored a proposal</span> in ${link('/domain/'+encodeURIComponent(prop.domain),prop.domain)}`;
    } else if(tx.app_type==='Attest'){
      // the attested proposal id lives in the tx app payload; ask the node (cairn front door only)
      const [full,vr]=await Promise.all([jx(SIB.node,'/tx/'+tx.txid),jx(SIB.cairnx,'/record/'+tx.txid)]);
      const pid=full&&full.tx&&full.tx.app&&full.tx.app.proposal_id;
      if(pid){
        const pidHex=pidHexOf(pid);
        const prop=await j('/proposal/'+pidHex).catch(()=>null);
        const score=full.tx.app.score;
        if(prop&&prop.domain==='cairnx:v1'){
          let rec=null; try{rec=JSON.parse(prop.uri);}catch{ /* not JSON: rec stays null, which describeOfferAttest handles */ }
          line=describeOfferAttest(tx,full.tx.app,pidHex,rec,vr&&typeof vr.applied==='boolean'?vr:null);
        } else if(prop){
          line=`${kind('Record')}<span class="what">Attested</span> score ${esc(score)} on ${link('/proposal/'+pidHex,short(pidHex,10),'mono')} in ${link('/domain/'+encodeURIComponent(prop.domain),prop.domain)}`;
        }
      } else if(!SIB.node) line=`${kind('Record')}<span class="what">Attestation</span> <span class="dim">(open via the cairn front door for full decoding)</span>`;
    } else if(tx.coinbase){ line=`${kind('CSD')}<span class="what">Block reward</span>: new CSD minted to the miner`; }
    else {
      const me=(tx.signer||'').toLowerCase();
      const outs=(tx.outputs||[]).filter(o=>(o.addr||'').toLowerCase()!==me);
      line=`${kind('CSD')}<span class="what">${addrLink(tx.signer)} sent CSD</span>${outs.length===1?` to ${addrLink(outs[0].addr)}`:` to ${outs.length} recipients`}`;
    }
    slot.innerHTML=line||'<span class="dim">a plain chain transaction</span>';
    paintNames(human);
  })();

  v.appendChild(el(`<div class="panel"><h2>Transaction ${typeBadge} <span id="inclbadge" class="badge pend">verifying inclusion…</span></h2>
    <div class="kv">
      <div>txid</div><div class="v mono">${hashHtml(tx.txid)}${copyBtn(tx.txid,'transaction id')}</div>
      <div>block</div><div class="v">${link('/block/'+tx.height,fmtInt(tx.height))} ${status?`· ${fmtInt(status.confirmations)} confs ${status.final?'<span class="badge ok">final</span>':'<span class="badge pend">maturing</span>'}`:''}</div>
      <div>time</div><div class="v" id="txtime"><span class="dim">…</span></div>
      <div>position</div><div class="v">${esc(tx.pos)}</div>
      <div>signer</div><div class="v">${addrLinkG(tx.signer)}</div>
      <div>fee</div><div class="v">${fmtCSD(tx.fee)}</div>
      <div>inputs / outputs</div><div class="v">${esc(tx.n_in)} / ${esc(tx.n_out)}</div>
    </div></div>`));
  // when the tx was mined (one block-header lookup, display only)
  (async()=>{ const t=$('#txtime'); if(!t) return;
    const blk=await j('/block/'+await j('/block-height/'+tx.height).catch(()=>null)).catch(()=>null);
    t.innerHTML=blk&&blk.time?`${fmtDate(blk.time)} <span class="dim">· ${ago(blk.time)}</span>`:'<span class="dim">-</span>'; })();
  v.appendChild(el(`<div class="panel"><h2>Outputs</h2><div class="scroll-x"><table><thead><tr><th class="num">#</th><th>address</th><th class="num">value</th><th class="opt">status</th></tr></thead>
    <tbody>${(tx.outputs||[]).map(o=>`<tr><td class="num dim">${esc(o.vout)}</td><td>${addrLink(o.addr)}</td><td class="num">${fmtCSD(o.value)}</td>
      <td class="opt">${o.spent_txid?`<span class="dim">spent by ${txidLink(o.spent_txid)}</span>`:'<span class="badge ok">unspent</span>'}</td></tr>`).join('')}</tbody></table></div></div>`));
  if(proof){
    v.appendChild(el(`<div class="panel"><h2>Merkle inclusion proof</h2>
      <div class="muted">This proof is served by an <i>untrusted</i> indexer, and so is the block header below. Your browser folds the branch and checks it equals the indexer's stated merkle root: a <b>consistency check</b> that the proof matches the header this same indexer reports. It is <b>NOT</b> a PoW/consensus proof: nothing here verifies the header's proof-of-work or that it is on the canonical chain. For a trustless inclusion proof, fold against a header obtained from the L0 light client (which checks PoW + checkpoints).</div>
      <div class="kv">
        <div>block height</div><div class="v">${fmtInt(proof.block_height)}</div>
        <div>position</div><div class="v">${esc(proof.pos)}</div>
        <div>merkle root</div><div class="v mono">${esc(proof.merkle_root)}</div>
        <div>branch (${proof.merkle.length})</div><div class="v mono">${proof.merkle.map((x)=>short(x)).join(' · ')||'<i>single-tx block</i>'}</div>
      </div></div>`));
    // Fold the branch against the block's merkle root. NOTE: that root comes from the SAME
    // untrusted indexer (no PoW/header verification here), so a matching fold proves only that
    // the proof is CONSISTENT with the header this indexer reports, not consensus inclusion.
    try{
      const blk=await j('/block/'+await j('/block-height/'+proof.block_height));
      const ok=await verifyInclusion(tx.txid,proof.pos,proof.merkle,blk.merkle);
      const b=$('#inclbadge');b.textContent=ok?'✓ consistent with indexer header (not PoW-verified)':'✗ inclusion FAILED';b.className='badge '+(ok?'ok':'bad');
    }catch(e){const b=$('#inclbadge');b.textContent='inclusion: '+e.message;b.className='badge bad';}
  } else {$('#inclbadge').textContent='no proof';$('#inclbadge').className='badge pend';}
}

async function addrPage(v,a){
  await warmCx();
  const [info,utxos,txs]=await Promise.all([j('/address/'+a),j('/address/'+a+'/utxo'),j('/address/'+a+'/txs')]);
  const s=info.chain_stats;
  v.innerHTML='';
  const lbl=labelOf(a);
  v.appendChild(el(`<div class="panel"><h2 class="ex-title">Address${lbl?` <span class="chip">${esc(lbl)}</span>`:''}</h2><div class="kv">
    <div>address</div><div class="v mono">${addrGroups(a,true)}${copyBtn(a,'address')}</div>
    <div>balance</div><div class="v"><b>${fmtCSD(s.balance)}</b></div>
    <div>received</div><div class="v">${fmtCSD(s.funded)}</div>
    <div>spent</div><div class="v">${fmtCSD(s.spent)}</div>
    <div>tx count</div><div class="v">${fmtInt(s.tx_count)}</div>
    <div>UTXOs</div><div class="v">${fmtInt(utxos.length)}</div>
  </div><div id="cxpanel"></div></div>`));

  // ── CairnX holdings (token balances + .csd names), cairn front door only ──
  (async()=>{
    const [cx,toklist]=await Promise.all([jx(SIB.cairnx,'/address/'+a),jx(SIB.cairnx,'/tokens')]);
    if(!cx) return;
    const dec={}; for(const t of (toklist||[])) dec[t.ticker]=t.decimals;
    const toks=Object.entries(cx.balances||{});
    const names=cx.names||[];
    if(!toks.length&&!names.length) return;
    $('#cxpanel').innerHTML=`<div class="cxbal">${
      toks.map(([t,b])=>`<span class="tk"><b>${esc(t)}</b> ${fmtAmt(b.available,dec[t]??0)}${Number(b.locked)?` <span class="dim">(+${fmtAmt(b.locked,dec[t]??0)} locked in offers)</span>`:''}</span>`).join('')}${
      names.map(n=>`<span class="nm">${esc(n)}.csd</span>`).join('')}</div>`;
  })();

  // tx table with a human ACTION column + direction relative to THIS address.
  // Heading shows the TRUE total (chain_stats.tx_count), not the loaded-page length; pages append
  // via the Esplora keyset cursor (/txs/chain/:last), so a hot treasury/faucet address is no longer
  // capped at its latest 25 txs.
  const me=a.toLowerCase();
  const PAGE=25;
  v.appendChild(el(`<div class="panel"><h2>Transactions (${fmtInt(s.tx_count)})</h2><div class="scroll-x"><table class="stack"><thead><tr><th>txid</th><th class="act">action</th><th class="opt num">block</th><th class="num">Δ for this address</th></tr></thead>
    <tbody id="txrows"></tbody></table></div><div id="txmore"></div></div>`));
  let loaded=0, lastTxid=null;
  const appendTxPage=async(page,later=true)=>{
    if(!Array.isArray(page)||!page.length){const m=$('#txmore'); if(m) m.innerHTML=loaded?'':'<div class="muted">no transactions</div>'; return;}
    await warmVerdicts(page.filter((t)=>t.app_type==='Propose'||t.app_type==='Attest').map((t)=>t.txid),later);
    const start=loaded;
    $('#txrows').insertAdjacentHTML('beforeend',page.map((t,k)=>{const i=start+k;return `<tr><td>${txidLink(t.txid)}</td><td class="act" id="act-${i}"><span class="dim">${esc(t.app_type)}</span></td><td class="opt num">${link('/block/'+t.height,fmtInt(t.height))}</td><td id="dir-${i}" class="num dim">…</td></tr>`;}).join(''));
    loaded+=page.length; lastTxid=page[page.length-1].txid;
    page.forEach((t,k)=>{decodeTxRow(t,start+k);});
    const more=$('#txmore');
    if(more) more.innerHTML=(page.length===PAGE&&loaded<s.tx_count)?`<button class="ex-btn" id="txloadmore">Load more (${fmtInt(loaded)} of ${fmtInt(s.tx_count)})</button>`:'';
    const btn=$('#txloadmore');
    if(btn) btn.onclick=async()=>{btn.disabled=true;btn.textContent='loading…';await appendTxPage(await j('/address/'+a+'/txs/chain/'+lastTxid).catch(()=>[]));};
  };

  // decode one row (each is a cheap local lookup)
  async function decodeTxRow(t,i){
    try{
      // rows carry outputs inline (indexer >= 0.2.5): no per-row /tx refetch; older responses fall back to one fetch
      const full=(t&&Array.isArray(t.outputs))?t:await j('/tx/'+t.txid);
      // direction: outputs to me − (if I signed: everything I paid)
      const recv=(full.outputs||[]).filter(o=>(o.addr||'').toLowerCase()===me).reduce((x,o)=>x+o.value,0);
      let delta;
      if((full.signer||'').toLowerCase()===me){
        const out=(full.outputs||[]).filter(o=>(o.addr||'').toLowerCase()!==me).reduce((x,o)=>x+o.value,0);
        delta=-(out+full.fee);
      } else delta=recv;
      const d=$('#dir-'+i);
      if(d) d.outerHTML=`<td class="num ${delta>=0?'green':'red'}">${delta>=0?'+':''}${fmtCSD(delta)}</td>`;
      if(full.app_type==='Propose'){
        const prop=await j('/proposal/'+t.txid).catch(()=>null);
        const line=prop&&(describeDomainRecord(prop.domain,prop.uri,VER&&VER[t.txid.toLowerCase()],prop.height)||`${kind('Record')}proposal in ${esc(prop.domain)}`);
        const slot=$('#act-'+i); if(slot&&line) slot.innerHTML=line;
      } else if(full.app_type==='Attest'&&SIB.node){
        const nf=await jx(SIB.node,'/tx/'+t.txid);
        const pid=nf&&nf.tx&&nf.tx.app&&nf.tx.app.proposal_id;
        if(pid){const pidHex=pidHexOf(pid), prop=await j('/proposal/'+pidHex).catch(()=>null);
          if(prop&&prop.domain==='cairnx:v1'){let rec=null;try{rec=JSON.parse(prop.uri);}catch{ /* not JSON: rec stays null, which describeOfferAttest handles */ }
            const slot=$('#act-'+i);
            if(slot) slot.innerHTML=describeOfferAttest(full,nf.tx.app,pidHex,rec,VER&&VER[t.txid.toLowerCase()]);
          }}
      } else if(full.coinbase){const slot=$('#act-'+i); if(slot) slot.innerHTML=`${kind('CSD')}block reward`;}
      else if(full.app_type==='Transfer'||full.app_type==='None'){const slot=$('#act-'+i); if(slot) slot.innerHTML=`${kind('CSD')}CSD transfer`;}
      paintNames($('#act-'+i));
    }catch{ /* a failed read leaves this row's placeholders; the other rows decode on their own */ }
  }

  await appendTxPage(txs,false);
}

// The proposal's content, from cairn's /content (same origin, front door only): served bytes are hashed here, as
// received, and only bytes whose sha256 equals the on-chain payload_hash read as verified. A mismatch is called one
// only when cairn's own X-CSD-Payload-Hash header names this hash; any other 200 (an edge error or challenge page,
// an app-shell fallback) is not cairn's answer, so it reads as unavailable.
async function contentBadge(badge,hash){
  const set=(text,cls)=>{ badge.textContent=text; badge.className='badge '+cls; };
  if(!SIB.content){ set('content check needs the cairn front door','pend'); return; }
  if(!/^0x[0-9a-f]{64}$/i.test(String(hash))){ set('no content hash','pend'); return; }
  const want=hash.toLowerCase();
  let bytes, named;
  try{
    const r=await fetch(SIB.content+want);
    if(r.status===404){ set('content not held by this front door','pend'); return; }
    if(!r.ok){ set('content unavailable','pend'); return; }
    named=String(r.headers.get('X-CSD-Payload-Hash')||'').toLowerCase()===want;
    bytes=new Uint8Array(await r.arrayBuffer());
  }catch{ set('content unavailable','pend'); return; }   // network error or an aborted body: nothing was checked
  if(bytesToHex(await sha256(bytes))===want) set('✓ content integrity verified','ok');
  else if(named) set('✗ content MISMATCH','bad');
  else set('content unavailable','pend');
}

// ── header stats + live ──
async function refreshStats(){
  try{const h=await j('/health');
    const ss=h.seconds_since_tip, lag=Math.max(0,(h.tip_height||0)-(h.indexed_height||0));
    const fresh=!h.stale&&lag<2&&(ss==null||ss<180);
    const behind=ss==null?'syncing':ss<60?ss+'s':ss<3600?Math.floor(ss/60)+'m':Math.floor(ss/3600)+'h';
    // Honest badge: a real indexer LAG (indexed_height < node tip -> catching up) is distinct from a merely
    // OLD tip (the indexer is AT the tip but blocks are slow, e.g. low hashrate). The latter is NOT the
    // indexer being "behind", so label it as the age of the newest block instead of blaming the indexer.
    const dot = lag>=2
      ? `<span class="amber" title="the indexer is catching up to the node (${lag} blocks)"><span class="ui-dot"></span>${fmtInt(lag)} blocks behind</span>`
      : fresh
        ? '<span class="green" title="indexer is at the chain tip"><span class="ui-dot ui-dot-live"></span>live</span>'
        : `<span class="amber" title="the indexer is at the tip; the newest block is ${behind} old (slow blocks / low hashrate)"><span class="ui-dot"></span>last block ${behind} ago</span>`;
    $('#stats').innerHTML=`<span>height <b>${fmtInt(h.indexed_height)}</b></span><span>txs <b>${fmtInt(h.txs)}</b></span><span>proposals <b>${fmtInt(h.proposals)}</b></span>${dot}`;
  }catch{$('#stats').innerHTML='<span class="red"><span class="ui-dot"></span>indexer offline</span>';}
}
refreshStats();setInterval(refreshStats,15000);
setInterval(()=>document.querySelectorAll('[data-ts]').forEach(e=>{const t=+e.getAttribute('data-ts'); if(t)e.textContent=age(t);}),10000);  // tick relative times
route();
</script>
