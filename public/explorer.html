<style>
@layer page {
  /* Measured against the approved preview's #explorer (compare.mjs). Colours, type, spacing, radii and durations are
     --ui-* tokens; the raw px are hairlines (1px), the focus ring, 1 or 2 px nudges on a token where the preview sits
     between two steps (as components.css does for its table cells), the 7 px status dot components.css also draws, and
     the preview's layout widths (the 120 px key column, the 1200 px measure, field, card and column minimums). Font
     sizes the scale lacks (the preview's 13.5, 12.5, 11.5 and 10.5 px) take the nearest token. This sheet is the page's
     own and complete: on a direct indexer hit cairn's components.css is absent, so the page cannot lean on it. */
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  /* clip, not hidden: clip makes no scroll container, so the site header's position:sticky keeps working */
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--ui-bg); color: var(--ui-ink); font: 400 var(--ui-text-md) / var(--ui-leading-body) var(--ui-font-sans);
    -webkit-font-smoothing: antialiased; }
  a { color: var(--ui-ink); text-decoration: none; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--ui-ink); outline-offset: 2px; border-radius: var(--ui-radius-sm); }
  b { font-weight: 500; }
  button { font: inherit; color: inherit; }
  svg.i { width: var(--ui-text-lg); height: var(--ui-text-lg); flex: none; fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round; }
  /* Geist Mono only for hashes, addresses, heights and table figures */
  .mono, .num { font-family: var(--ui-font-mono); font-size: var(--ui-text-xs); }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .dim, .muted { color: var(--ui-muted); }
  .green { color: var(--ui-up); }
  .red { color: var(--ui-down); }
  .amber { color: var(--ui-warn); }
  /* a hash's 0x and leading zeros, the preview's faint: colour only, the hash stays whole and selectable */
  .lz { color: var(--ui-faint); }
  /* an address in groups of four, by spacing only: a copy of it carries no spaces */
  .g4 + .g4, .g4 + .gx, .gx + .g4 { margin-left: 0.4em; }
  /* an address shown as its .csd name is a name, so it reads in Geist */
  a.addrl.hasname { font-family: var(--ui-font-sans); font-size: inherit; }
  /* the status dot as components.css draws it, inline in text (standalone that sheet is absent) */
  .ui-dot { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; vertical-align: 1px; }

  /* standalone: cairn's header.js is absent and #site-header keeps this page's own brand line */
  #site-header:empty { display: none; }
  #site-header:has(> .ex-brand) { display: flex; align-items: center; min-height: var(--ui-space-7);
    padding: 0 clamp(var(--ui-space-4), 4vw, var(--ui-space-6)); border-bottom: 1px solid var(--ui-line); }
  .ex-brand { font-weight: 600; letter-spacing: var(--ui-track-snug); }

  /* 1200 px: the content measure the site's other pages use */
  .ex-wrap { max-width: 1200px; margin: 0 auto; }
  .ex-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ui-space-4);
    padding: calc(var(--ui-space-4) + 2px) var(--ui-space-5); border-bottom: 1px solid var(--ui-line); }
  .ex-search { flex: 1 1 320px; min-width: 0; display: flex; align-items: center; gap: var(--ui-space-2); height: calc(var(--ui-space-6) + var(--ui-space-3));
    padding: 0 calc(var(--ui-space-3) + 2px); border: 1px solid var(--ui-line); border-radius: var(--ui-radius-md); background: var(--ui-surface);
    transition: border-color var(--ui-dur-2) var(--ui-ease), box-shadow var(--ui-dur-2) var(--ui-ease); }
  .ex-search > svg.i { color: var(--ui-muted); }
  .ex-search:focus-within { border-color: var(--ui-ink); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ui-ink) 10%, transparent); }
  .ex-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ui-ink); font: inherit;
    font-size: var(--ui-text-md); }
  .ex-search input::placeholder { color: var(--ui-muted); }
  #stats { flex: none; }
  .kbd { padding: 2px calc(var(--ui-space-1) + 2px); border: 1px solid var(--ui-line-2); border-bottom-width: 2px; border-radius: calc(var(--ui-radius-sm) - 1px);
    color: var(--ui-muted); font: 500 var(--ui-text-2xs) var(--ui-font-mono); }

  main { padding-bottom: var(--ui-space-6); }
  #view > :first-child { border-top: 0; }
  .panel { position: relative; min-width: 0; padding: var(--ui-space-5); border-top: 1px solid var(--ui-line); }
  /* a table runs to the panel's edges; its cells carry the inset */
  .panel > .scroll-x { margin-inline: calc(-1 * var(--ui-space-5)); }
  /* a section heading, with its side note (a count, a window, the live marker or a filter) at the right */
  h2 { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ui-space-1) var(--ui-space-3);
    min-height: var(--ui-space-5); margin: 0 0 var(--ui-space-3); color: var(--ui-ink);
    font: 500 var(--ui-text-subhead) / var(--ui-leading-body) var(--ui-font-sans); letter-spacing: normal; }
  .h-side { display: inline-flex; align-items: center; gap: var(--ui-space-2); color: var(--ui-muted); font-size: var(--ui-text-xs); font-weight: 500; }
  .h-side > a { color: var(--ui-muted); }
  .h-side > a:hover { color: var(--ui-ink); }
  .h-tabs { display: inline-flex; gap: var(--ui-space-1); }
  /* a detail page's title, as the preview's block heading: the title and its status badge side by side */
  h2.ex-title { justify-content: flex-start; gap: var(--ui-space-3); margin-bottom: var(--ui-space-2); font-size: var(--ui-text-stat); letter-spacing: var(--ui-track-snug); }
  h2 .badge { letter-spacing: normal; }
  .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row > .panel + .panel { border-left: 1px solid var(--ui-line); }

  /* the chain at a glance: label over value, split by hairlines */
  .pulse { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--ui-line); }
  .pu { min-width: 0; padding: var(--ui-space-4) var(--ui-space-5); border-right: 1px solid var(--ui-line); }
  .pu:last-child { border-right: 0; }
  .pu .l, .facts dt, .mkt-l { display: block; color: var(--ui-muted); font: 500 var(--ui-text-2xs) / var(--ui-leading-body) var(--ui-font-mono);
    letter-spacing: var(--ui-track-label); text-transform: uppercase; }
  .pu .n { margin-top: calc(var(--ui-space-1) + 2px); font: 500 var(--ui-text-stat) / var(--ui-leading-tight) var(--ui-font-sans);
    letter-spacing: var(--ui-track-snug); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  /* latest blocks and the CairnX activity, side by side */
  .ex-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--ui-line); }
  .ex-col { min-width: 0; padding: 0; border-top: 0; }
  .ex-col + .ex-col { border-left: 1px solid var(--ui-line); }
  .ex-col > h2 { margin: 0; padding: var(--ui-space-4) var(--ui-space-5) calc(var(--ui-space-1) + 2px); }
  .ex-col > .scroll-x { margin: 0; }
  /* a column's quiet line (the activity's unread verdicts) in the column's gutter, above its table */
  .ex-col > #actnote > .ex-unread { margin: 0; padding: 0 var(--ui-space-5) var(--ui-space-3); }
  .ex-cols + .panel { border-top: 0; }
  /* the activity filter: quiet pill tabs in the heading, the choice on the sunken ground */
  .tab { height: var(--ui-space-5); padding: 0 var(--ui-space-2); border: 0; border-radius: var(--ui-radius-pill); background: transparent;
    color: var(--ui-muted); font: 500 var(--ui-text-xs) / 1 var(--ui-font-sans); cursor: pointer;
    transition: color var(--ui-dur-1) var(--ui-ease), background-color var(--ui-dur-2) var(--ui-ease); }
  .tab:hover { color: var(--ui-ink); }
  .tab[aria-pressed="true"] { background: var(--ui-sunken); color: var(--ui-ink); }
  #livepill.reorg { color: var(--ui-down); }
  #livepill .ui-dot { color: var(--ui-up); }
  #livepill.reorg .ui-dot { color: var(--ui-down); animation: none; }

  /* figures under a section heading: label over value (the preview's facts) */
  .facts { display: flex; flex-wrap: wrap; gap: var(--ui-space-4) calc(var(--ui-space-5) + var(--ui-space-4)); margin: 0 0 var(--ui-space-4); }
  .facts dd { margin: calc(var(--ui-space-1) + 2px) 0 0; font: 500 var(--ui-text-lg) / var(--ui-leading-snug) var(--ui-font-sans); letter-spacing: var(--ui-track-snug);
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .facts > div { min-width: 0; }
  .bar { height: var(--ui-space-1); overflow: hidden; border-radius: var(--ui-radius-pill); background: var(--ui-sunken); }
  .bar i { display: block; height: 100%; background: var(--ui-ink); }

  /* a token card: the one card on the page, since it opens the token */
  .coins { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--ui-space-3); }
  .coin { display: block; padding: var(--ui-space-4); border: 1px solid var(--ui-line); border-radius: var(--ui-radius-lg); background: var(--ui-surface);
    color: inherit; transition: border-color var(--ui-dur-2) var(--ui-ease); }
  .coin:hover { border-color: var(--ui-line-2); text-decoration: none; }
  .coin .tk { font-weight: 500; }
  .coin .nm { margin-left: var(--ui-space-2); color: var(--ui-muted); font-size: var(--ui-text-xs); }
  .coin .meta { display: flex; flex-wrap: wrap; gap: var(--ui-space-1) var(--ui-space-4); margin: var(--ui-space-2) 0 var(--ui-space-3); color: var(--ui-muted);
    font-size: var(--ui-text-xs); }
  .coin .meta b { color: var(--ui-ink); font-weight: 500; font-variant-numeric: tabular-nums; }

  /* tables read like a ledger (the preview's .tbl): mono labels, hairline rows, figures right-aligned in tabular digits */
  table { width: 100%; border-collapse: collapse; font-size: var(--ui-text-sm); line-height: normal; }
  th { padding: var(--ui-space-3) var(--ui-space-5) calc(var(--ui-space-3) - 2px); border-bottom: 1px solid var(--ui-line); color: var(--ui-muted);
    text-align: left; font: 500 var(--ui-text-2xs) / var(--ui-leading-tight) var(--ui-font-mono); letter-spacing: var(--ui-track-label);
    text-transform: uppercase; white-space: nowrap; }
  td { padding: calc(var(--ui-space-3) - 1px) var(--ui-space-5); border-bottom: 1px solid var(--ui-line); text-align: left; white-space: nowrap;
    vertical-align: baseline; }
  td.m { font-family: var(--ui-font-mono); font-size: var(--ui-text-xs); }
  th.r, td.r { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background-color var(--ui-dur-1) var(--ui-ease); }
  tbody tr:hover { background: var(--ui-sunken); }
  th.num { font-size: var(--ui-text-2xs); }
  th.num:first-child, td.num:first-child { width: 1%; }
  td.act { min-width: 260px; white-space: normal; overflow-wrap: anywhere; }
  td.empty { color: var(--ui-muted); white-space: normal; }
  .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* the home's activity ledger: kind, the record, the transaction */
  /* the record takes the room the preview's short amounts leave: no second inset between the label and the record */
  table.acts td.k { width: 1%; padding-right: 0; }
  table.acts td.act { min-width: 0; }
  .act-line .cx-noeffect { margin-left: var(--ui-space-2); }
  /* side by side, the two lists end level: as many rows each, every row one line of one height (a block's row grows to
     the activity's, whose family label is the tallest thing in either). The record is cut with an ellipsis (whole in its
     title and on its transaction's page); a refusal's tag stays whole after it. */
  @media (min-width: 861px) {
    .ex-col tbody td { height: calc(var(--ui-space-6) + var(--ui-space-3) + 1px); }
    table.acts td.act { width: 100%; max-width: 0; white-space: nowrap; }
    .act-line { display: flex; align-items: baseline; min-width: 0; }
    .act-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .act-line .cx-noeffect { flex: none; }
  }

  /* key and value: the preview's 120 px key column */
  .kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: calc(var(--ui-space-3) - 2px) var(--ui-space-4); align-items: baseline; align-content: start; min-width: 0;
    font-size: var(--ui-text-sm); }
  .kv > div:nth-child(odd) { color: var(--ui-muted); font-size: var(--ui-text-xs); }
  .kv > div:nth-child(odd)::first-letter { text-transform: uppercase; }
  .kv > .v { min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .kv + .kv { margin-top: calc(var(--ui-space-3) - 2px); }
  /* side by side in a detail grid the two lists start level (its row gap spaces them once they stack) */
  .ex-detail > .kv + .kv { margin-top: 0; }
  /* a detail page's head: the title, the record in words, then its keys */
  h2.ex-title + .kv { margin-top: var(--ui-space-4); }
  .flow + .kv { margin-top: var(--ui-space-5); }
  /* the record line keeps its own 12 px under it: 24 px to the keys, as after the flow line */
  .action + .kv { margin-top: var(--ui-space-3); }
  .ex-detail { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ui-space-2) calc(var(--ui-space-5) + var(--ui-space-4)); margin-top: var(--ui-space-4); }
  .copy { display: inline-grid; place-items: center; width: calc(var(--ui-space-5) + 2px); height: calc(var(--ui-space-5) + 2px); margin-left: var(--ui-space-1);
    padding: 1px calc(var(--ui-space-1) + 2px); border: 0; border-radius: calc(var(--ui-radius-sm) + 1px); background: transparent; color: var(--ui-muted); vertical-align: middle; cursor: pointer;
    transition: background-color var(--ui-dur-1) var(--ui-ease), color var(--ui-dur-1) var(--ui-ease); }
  .copy:hover { background: var(--ui-sunken); color: var(--ui-ink); }
  .copy svg.i { width: var(--ui-text-subhead); height: var(--ui-text-subhead); }
  .copy.done { color: var(--ui-up); }

  /* the family label of a record */
  .kind { display: inline-flex; align-items: center; justify-content: center; min-width: var(--ui-space-8); margin-right: var(--ui-space-1);

    font: 500 var(--ui-text-2xs) var(--ui-font-sans); vertical-align: 1px; text-decoration: none; white-space: nowrap; }
  td.k .kind { margin-right: 0; }
  /* a known operational address's name, after the address */
  .chip { margin-left: var(--ui-space-2); color: var(--ui-muted); font-size: var(--ui-text-xs); white-space: nowrap; }
  /* a status badge, as the preview's: a pill on the surface; the tinted kinds carry state only */
  .badge { display: inline-flex; align-items: center; gap: calc(var(--ui-space-1) + 2px); height: var(--ui-space-5); padding: 0 calc(var(--ui-space-2) + 1px);
    border: 1px solid var(--ui-line); border-radius: var(--ui-radius-pill); background: var(--ui-surface); color: var(--ui-ink-2);
    font: 500 var(--ui-text-2xs) / 1 var(--ui-font-sans); white-space: nowrap; vertical-align: 1px; }
  .badge svg.i { width: var(--ui-text-xs); height: var(--ui-text-xs); stroke-width: 2; }
  .badge.ok { border-color: color-mix(in oklab, var(--ui-up) 35%, var(--ui-line)); background: var(--ui-up-tint); color: var(--ui-up); }
  .badge.bad { border-color: color-mix(in oklab, var(--ui-down) 35%, var(--ui-line)); background: var(--ui-down-tint); color: var(--ui-down); }
  .badge.caution { border-color: color-mix(in oklab, var(--ui-warn) 35%, var(--ui-line)); background: var(--ui-warn-tint); color: var(--ui-warn); }
  /* inside a line of text or a table row, the small badge, so the line keeps its height */
  :is(td, .kv .v) .badge { height: calc(var(--ui-space-4) + var(--ui-space-1)); }

  .action { padding: 0 0 var(--ui-space-3); font-size: var(--ui-text-md); line-height: var(--ui-leading-body); }
  .action .what { color: var(--ui-ink); }
  /* an amount or a name in a record line stays on one line: a break inside a number reads as two numbers */
  .action b, td.act b { white-space: nowrap; }
  /* a CairnX record the resolver refused: struck and tagged "No effect", so it never reads as an effect */
  .cx-void { color: var(--ui-muted); text-decoration: line-through; text-decoration-color: var(--ui-down); }
  .cx-void .what, .cx-void b, .cx-void a { color: inherit; }
  .cx-noeffect { display: inline-flex; align-items: center; gap: var(--ui-space-1); margin-left: var(--ui-space-1); padding: 0 var(--ui-space-2);
    border-radius: var(--ui-radius-sm); background: var(--ui-down-tint); color: var(--ui-down); font: 500 var(--ui-text-2xs) / 1.8 var(--ui-font-sans);
    text-decoration: none; vertical-align: 1px; cursor: help; white-space: nowrap; }
  .cx-noeffect svg.i { width: var(--ui-text-2xs); height: var(--ui-text-2xs); stroke-width: 2; }
  .flow { display: flex; flex-wrap: wrap; gap: var(--ui-space-2) var(--ui-space-5); padding: var(--ui-space-1) 0 0; color: var(--ui-muted);
    font-size: var(--ui-text-sm); }
  .flow b { color: var(--ui-ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .flow .out b { color: var(--ui-down); }
  .flow .in b { color: var(--ui-up); }
  .muted { font-size: var(--ui-text-xs); }
  div.muted { margin-top: var(--ui-space-3); max-width: 80ch; line-height: var(--ui-leading-body); }
  div.muted + .kv, div.muted + .scroll-x { margin-top: var(--ui-space-4); }

// They let a view show that a record the resolver REFUSED (mint past supply, mint by a non-issuer, deploy with an unpaid
// fee, an underfunded transfer...) had NO effect, instead of rendering it as if it succeeded. Each view keeps its own
// book, so a read another view makes (a home refresh in flight) never changes what this one says. A verdict once read is
// kept (a resolved record's verdict does not change); a txid whose read failed stays unread and is asked again by the
// book's next read; the view says so while any record it shows is unread (verdictLine).
const TXID_RE=/^0x[0-9a-f]{64}$/;
function verdictBook(){
  const ver={}, unread=new Set();
  const book={
    get:(id)=>ver[String(id).toLowerCase()]||null,
    unread:(id)=>unread.has(String(id).toLowerCase()),
    state:()=>!SIB.cairnx?'standalone':unread.size?'failed':'ok',
    /** Read the verdicts of `ids` and of every txid still unread; true when the read answered. */
    async read(ids){
      if(!SIB.cairnx) return false;
      const want=[...new Set([...(ids||[]).map((x)=>String(x).toLowerCase()),...unread])].filter((x)=>TXID_RE.test(x)&&!(x in ver));
      if(!want.length) return true;
      const chunks=[]; for(let i=0;i<want.length;i+=100) chunks.push(want.slice(i,i+100));
      const got=(await Promise.all(chunks.map((c)=>sib(SIB.cairnx,'/records?ids='+c.join(','))))).map(sibData);
      let all=true;
      got.forEach((r,i)=>{
        if(!(r&&r.records&&typeof r.records==='object')){ all=false; for(const x of chunks[i]) unread.add(x); return; }
        for(const [id,v] of Object.entries(r.records)) ver[id.toLowerCase()]={applied:v.applied,note:v.note};
        for(const x of chunks[i]) unread.delete(x);
      });
      return all;
    },
  };
  return book;
}
/** The verdict a /cairnx/record/:txid read carries, or null (no resolved record, standalone, or the read failed). */
const recordVerdict=(r)=>r.state==='ok'&&r.data&&typeof r.data.applied==='boolean'?r.data:null;
/** Under one record's line, when its verdict read failed: why it reads as a request. */
const recordLine=(r)=>r.state==='failed'?`<div class="muted ex-unread">Could not check this record with the CairnX resolver right now, so it is not shown as applied. ${AGAIN}</div>`:'';
/** The quiet line on a ledger of CairnX records while any it shows is unread (none of those reads as applied), or when
 *  there is no resolver to ask; empty once every shown record's verdict was read. */
function verdictLine(book){
  const st=book.state();
  if(st==='failed') return `<div class="muted ex-unread" id="verdict-line">Could not check these records with the CairnX resolver right now, so none is shown as applied. ${AGAIN}</div>`;
  if(st==='standalone') return '<div class="muted ex-unread" id="verdict-line">This standalone view has no CairnX resolver to ask, so each record reads as the request it makes.</div>';
  return '';
}
// Wrap a decoded record line with its resolver verdict. A refused record is struck through and
// tagged "no effect" with the reason: the tx is real and paid its anchor fee, but the CairnX
// action was a no-op that anyone re-running the open resolver reproduces.
function cxVerdict(body,verdict){
  if(body==null) return body;
  if(verdict&&verdict.applied===false)
    return `<span class="cx-void">${body}</span> <span class="cx-noeffect" title="The CairnX resolver REJECTED this record. It has no effect on token state, and anyone re-running the open resolver gets the same result. The transaction is real and paid its anchor fee; only the CairnX action was a no-op.">${ICON.x}No effect${verdict.note?`: ${esc(verdict.note)}`:''}</span>`;
  return body;
}
// An effect word (Minted, Finalized name...) needs the resolver's applied verdict; without one the line is the request
// the record makes, as describeOfferAttest words an Attest.
function describeCairnx(rec,height,verdict){
  try{
    const done=!!verdict&&verdict.applied===true, say=(applied,request)=>done?applied:request;
    const giveTok = rec.give&&rec.give.ticker, giveName = rec.give&&rec.give.name;
    switch(rec.t){
      case 'deploy': return `${kind('Token')}<span class="what">${say('Deployed token','Deploy request for token')} <b>${esc(rec.ticker)}</b></span>: supply ${fmtAmt(rec.supply,rec.decimals)}, ${rec.mint==='issuer'?'issuer-mint (fixed)':'open mint'}${rec.name?` · “${esc(rec.name)}”`:''}`;
      case 'mint': return `${kind('Token')}<span class="what">${say('Minted','Mint request for')} <b>${esc(rec.ticker)}</b></span>${rec.amount?`: ${amt(rec.amount,rec.ticker)}`:''}`;
      case 'transfer': return `${kind('Token')}<span class="what">${say('Transferred','Transfer request for')} <b>${amt(rec.amount,rec.ticker)}</b> <b>${esc(rec.ticker)}</b></span> to ${addrLink(rec.to)}`;
      case 'offer': {
        const what = giveName?`name <b>${esc(giveName)}.csd</b>`:`<b>${amt(rec.give.amount,giveTok)}</b> <b>${esc(giveTok)}</b>`;
        const price = rec.want.value!=null?`${fmtCSD(rec.want.value)}`:`${amt(rec.want.amount,rec.want.ticker)} ${esc(rec.want.ticker)}`;
        return `${kind('Market')}<span class="what">${say('Listed','Listing request:')} ${what} for <b>${price}</b></span>${rec.taker?`, reserved for ${addrLink(rec.taker)} (RFQ)`:', open offer'}${rec.min?` · partial fills ≥ ${fmtCSD(rec.min)}`:''}${rec.bid?' · answers a bid':''}`;
      }
      case 'bid': {
        const want = rec.want.name?`name <b>${esc(rec.want.name)}.csd</b>`:`<b>${amt(rec.want.amount,rec.want.ticker)}</b> <b>${esc(rec.want.ticker)}</b>`;
        return `${kind('Market')}<span class="what">${say('Bid','Bid request:')} <b>${fmtCSD(rec.give.value)}</b> for ${want}</span>: non-binding; a seller answers with a reserved offer`;
      }
      case 'ocancel': return `${kind('Market')}<span class="what">${say('Cancelled all open offers','Request to cancel all open offers')}</span>${rec.ticker?` in <b>${esc(rec.ticker)}</b>`:rec.name?` on <b>${esc(rec.name)}.csd</b>`:''}`;
      case 'ncommit': return `${kind('Name')}<span class="what">${say('Sealed a name commitment','Name commitment request')}</span>: the name is revealed later (front-run defense)`;
      case 'name': return `${kind('Name')}<span class="what">${done?(rec.salt?revealKind(height):'Claimed'):(rec.salt?'Reveal request for':'Claim request for')} name <b>${esc(rec.name)}.csd</b></span>`;
      case 'nfinalize': return `${kind('Name')}<span class="what">${say('Finalized name','Finalize request for name')} <b>${esc(rec.name)}.csd</b></span>${done?': registration paid, the lease starts':''}`;
      case 'nxfer': return `${kind('Name')}<span class="what">${say('Transferred name','Transfer request for name')} <b>${esc(rec.name)}.csd</b></span> to ${addrLink(rec.to)}`;
      case 'nset': return `${kind('Name')}<span class="what">${say('Pointed','Point request for')} <b>${esc(rec.name)}.csd</b></span> at ${addrLink(rec.addr)}`;
      case 'nrenew': return `${kind('Name')}<span class="what">${say('Renewed the lease on','Renewal request for the lease on')} <b>${esc(rec.name)}.csd</b></span> for one more year`;
      case 'tmeta': return `${kind('Token')}<span class="what">${say('Updated','Update request for')} <b>${esc(rec.ticker)}</b> metadata</span> (content-addressed)`;
      default: return null;
    }
  }catch{return null;}
}
// A salted `name` record (a reveal) is a payment-free reservation from the resolver's V25 gate on and a claim below
// it; without the gate height (standalone, or the resolver's /health unread) it is named only as a reveal.
function revealKind(height){
  const v25=GATES?Number(GATES.V25):NaN, h=Number(height);
  if(!Number.isFinite(v25)||!Number.isFinite(h)) return 'Revealed';
  return h>=v25?'Reserved':'Claimed';
}
function describeDomainRecord(domain,uri,verdict,height){
  if(domain==='cairnx:v1'){ try{ return cxVerdict(describeCairnx(JSON.parse(uri),height,verdict),verdict); }catch{ return null; } }
  if(domain==='csd:anchor:base'){ try{ const a=JSON.parse(uri); return `${kind('Bridge')}<span class="what">Anchored Base block <b>${fmtInt(a.height??a.number??0)}</b></span> into CSD (cross-chain checkpoint)`; }catch{ return null; } }
  if(domain==='csd:bridge:deploy'){ return `${kind('Bridge')}<span class="what">Bridge deployment registry record</span>: the canonical contract addresses, verifiable against any node`; }
  return null;
}
// The proposal id an Attest names, as 0x hex (the node serves it as hex or as a byte array).
const pidHexOf=(pid)=>typeof pid==='string'?pid:'0x'+Array.from(pid).map(x=>x.toString(16).padStart(2,'0')).join('');
// An Attest on a CairnX offer or bid in plain words. The node mines a paid fill whose delivery CairnX refuses, so the
// words for an effect (bought, cancelled, reserved) need the resolver's applied verdict; without it the line names
// the request.
function describeOfferAttest(tx,app,pidHex,rec,verdict){
  const off=link('/proposal/'+pidHex,short(pidHex,10),'mono'), done=!!verdict&&verdict.applied===true, offer=!!rec&&rec.t==='offer';
  const score=app.score;
  if(score!==0&&!(app.confidence===1000000&&rec)&&!(offer&&(score===50||score===100)))
    return `${kind('Record')}<span class="what">Attested</span> score ${esc(score)} on ${off}`;
  const me=(tx.signer||'').toLowerCase();
  const paid=(tx.outputs||[]).filter(o=>(o.addr||'').toLowerCase()!==me).reduce((s,o)=>s+o.value,0);
  const what=offer?(rec.give&&rec.give.name?`name <b>${esc(rec.give.name)}.csd</b>`:`<b>${esc(rec.give&&rec.give.ticker)}</b>`):'';
  let body;
  if(score===0){ const of=rec&&rec.t==='bid'?'a bid':'an offer';
    body=done?`${kind('Market')}<span class="what">Cancelled</span> ${of}: ${off}`:`${kind('Market')}<span class="what">Cancel request</span> on ${of}: ${off}`; }
  else if(app.confidence===1000000){
    const terms=`(${amt(rec.give&&rec.give.amount,rec.give&&rec.give.ticker)} ${esc(rec.give&&rec.give.ticker)} for ${amt(rec.want&&rec.want.amount,rec.want&&rec.want.ticker)} ${esc(rec.want&&rec.want.ticker)}, paid in tokens; no CSD moves)`;
    body=done?`${kind('Market')}<span class="what">Token swap fill</span>: took the offer ${off} ${terms}`:`${kind('Market')}<span class="what">Token swap fill request</span> on the offer ${off} ${terms}`; }
  else if(score===50) body=done?`${kind('Market')}<span class="what">Reserved ${what}</span> <span class="muted">(open offer, claimed; the purchase completes after a short reorg-safe wait)</span>, offer ${off}`
    :`${kind('Market')}<span class="what">Claim request on ${what}</span>, offer ${off}`;
  else body=done?`${kind('Market')}<span class="what">Bought ${what}</span> for <b>${fmtCSD(paid)}</b>, offer ${off}`
    :`${kind('Market')}<span class="what">Fill request on ${what}</span>: paid <b>${fmtCSD(paid)}</b>, offer ${off}`;
  return cxVerdict(body,verdict);
}
// payment flow of a tx, from the signer's perspective (single-signer chain: signer pays all inputs)
function flowHtml(tx){
  const me=(tx.signer||'').toLowerCase();
  let toOthers=0, change=0; const outs=[];
  for(const o of (tx.outputs||[])){
    if((o.addr||'').toLowerCase()===me) change+=o.value;
    else { toOthers+=o.value; outs.push(o); }
  }
  const parts=[];
  if(tx.coinbase) parts.push(`<span class="f in">Mined <b>+${fmtCSD((tx.outputs||[]).reduce((s,o)=>s+o.value,0))}</b> (block reward)</span>`);
  else{
    if(outs.length) parts.push(`<span class="f out">Sent <b>${MINUS}${fmtCSD(toOthers)}</b> ${outs.length===1?`to ${addrLink(outs[0].addr)}`:`to ${outs.length} recipients`}</span>`);
    parts.push(`<span class="f out">Fee <b>${MINUS}${fmtCSD(tx.fee)}</b></span>`);
    if(change) parts.push(`<span class="f">Change back <b>${fmtCSD(change)}</b></span>`);
  }
  return `<div class="flow">${parts.join('')}</div>`;
}

// ── CSD/USD (display only): cairn's /api/market through the front door, formatted and sourced by its chart
// module. A 503 (market data off, or no price in the last 24 h) hides the figures and is asked again after
// 5 min; the price body is re-read every 2 min (edge-cached 60 s), the daily series every 10 min. ──
const MKT={c:null,at:0,offUntil:0,s:null,sAt:0,ver:0};
let mktP=null;
async function marketRead(){
  const now=Date.now();
  if(!SIB.market||now<MKT.offUntil) return;
  if(now-MKT.at>=120000){
    // display only: a 503 (no price), a failed read and standalone all hide the figures; asked again after 5 min
    const c=sibData(await sib(SIB.market,'/csd'));
    MKT.at=now; MKT.ver++; MKT.c=c&&c.ok===true?c:null;
    if(!MKT.c){ MKT.offUntil=now+300000; return; }
  }
  if(now-MKT.sAt>=600000){
    const s=sibData(await sib(SIB.market,'/series?pair=csd-usd&period=1d&range=30d'));
    MKT.sAt=now; MKT.ver++;
    if(s&&s.ok===true&&Array.isArray(s.points)) MKT.s=s;
  }
}
const SERIES_SRC={coinpaprika:'CoinPaprika',safetrade:'SafeTrade'};
// The preview's price update for a figure that moved: the new value slides in from the side it moved to, with a short
// green or red tint; reduced motion keeps the tint and drops the slide. Only on a change, never on the first paint.
function rollFlash(e,dir){
  e.classList.remove('ex-flash-up','ex-flash-down'); void e.offsetWidth; e.classList.add(dir>0?'ex-flash-up':'ex-flash-down');
  if(!e.animate||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  e.animate([{transform:`translateY(${dir>0?60:-60}%)`,opacity:0},{transform:'none',opacity:1}],{duration:DUR3,easing:EASE});
}
/** Render the CSD/USD block in `box` from the cached reads; one 60 s check while the box is on the page. */
async function marketPanel(box){
  if(!box||!SIB.market) return;
  await (mktP??=marketRead().finally(()=>{mktP=null;}));
  if(!box.isConnected) return;
  if(!box.dataset.tick){ box.dataset.tick='1'; const t=setInterval(()=>{ if(!box.isConnected) clearInterval(t); else marketPanel(box); },60000); }
  if(box.dataset.ver===String(MKT.ver)) return;
  box.dataset.ver=String(MKT.ver);
  const c=MKT.c, C=c?await charts():null, rate=C?C.csdRate(c):null;
  if(!rate){ dropCharts(box); box.hidden=true; box.replaceChildren(); return; }
  const R=(basis)=>C.rateEl(rate,C.fmtUsd,undefined,basis,{disclaim:false});
  const fin=(x)=>x!=null&&Number.isFinite(Number(x));   // Number(null) is 0: an absent number must not print as 0
  const n=(x,d=0)=>fin(x)?Number(x).toLocaleString('en-US',{maximumFractionDigits:d}):'-';
  const usd=(x)=>fin(x)?`${C.fmtUsd(x)} USD`:'-';
  const at=(basis)=>basis==='vwap24h'?'at the 24h VWAP':'at the last price';
  // each figure keeps its number (data-v), so the next re-read can tell which ones moved
  const fig=(label,value,second,source,num)=>{ const b=tag('div','mkt-fig'), v=tag('div','mkt-v'); v.append(tag('span','mkt-n',value));
    if(fin(num)) v.dataset.v=String(Number(num)); b.dataset.label=label; b.append(tag('div','mkt-l',label),v);
    if(second) b.append(tag('div','mkt-u',second)); const s=tag('div','mkt-s'); s.append(source); b.append(s); return b; };
  const sub=tag('div','mkt-sub','CSD/USD · display only · thin market');
  if(rate.source==='SafeTrade'){ const a=tag('a','','SafeTrade'); a.href=C.SAFETRADE_URL; a.rel='noopener'; a.target='_blank'; sub.append(' · CSD prices from ',a,', an exchange we do not operate'); }
  const grid=tag('div','mkt-grid');
  grid.append(
    fig('price',usd(c.price.last),c.range24h&&fin(c.range24h.low)&&fin(c.range24h.high)?`24h range ${C.fmtUsd(c.range24h.low)} to ${C.fmtUsd(c.range24h.high)}`:'',R('last trade'),c.price.last),
    fig('24h VWAP',usd(c.vwap24h),'',R('24h volume / 24h amount'),c.vwap24h),
    fig('market cap',usd(c.marketCap&&c.marketCap.usd),c.supply?`emitted ${n(c.supply.emitted)} CSD at block ${n(c.supply.height)}`:'',R(`${at(c.marketCap&&c.marketCap.basis)} · thin market`),c.marketCap&&c.marketCap.usd),
    fig('fully diluted',usd(c.fdv&&c.fdv.usd),c.supply?`max supply ${n(c.supply.max,2)} CSD`:'',R(at(c.fdv&&c.fdv.basis)),c.fdv&&c.fdv.usd),
    fig('24h volume',usd(c.volume24h&&c.volume24h.usd),c.volume24h&&c.volume24h.csd!=null?`${n(c.volume24h.csd)} CSD`:'',R("the venue's 24h volume"),c.volume24h&&c.volume24h.usd));
  const s=MKT.s, src=s?String(s.source||'').split(',').map(k=>SERIES_SRC[k]).filter(Boolean).join(', then '):'';
  const head=tag('div','muted',`CSD/USD · last 30 days · daily closes${src?' · '+src:''}`);
  let host=box.querySelector('#csdusd-chart');
  if(!host){ host=tag('div','xchart'); host.id='csdusd-chart'; }
  const was=new Map([...box.querySelectorAll('.mkt-fig')].map((f)=>[f.dataset.label,Number(f.querySelector('.mkt-v')?.dataset.v)]));
  box.replaceChildren(sub,grid,head,host);
  for(const f of grid.querySelectorAll('.mkt-fig')){ const a=was.get(f.dataset.label), v=f.querySelector('.mkt-v'), b=Number(v.dataset.v);
    if(Number.isFinite(a)&&Number.isFinite(b)&&a!==b) rollFlash(v.firstElementChild,b>a?1:-1); }
  box.hidden=false;
  await plot(host,(s?s.points:[]).map(p=>[p[0],p[4]]),{label:'CSD/USD',range:'last 30 days',format:C.fmtUsd,
    staleSecs:c.stale?c.ageSecs:null,emptyText:'No CSD/USD close in the last 30 days'});
}

// ── pages ──
// The home's two lists show as many rows each: a new block or record enters at the top and the last row leaves.
const HOME_ROWS=12;
const NAME_KINDS=new Set(['name','nset','nxfer','nrenew','ncommit']);
// A read a page shows the rest without: its data, or FAILED, so a panel never reads a failed read as an empty answer.
const FAILED=Object.freeze({failed:true});
const soft=(p)=>j(p).catch(()=>FAILED);
const known=(x)=>x===FAILED?null:x;
/** A table's one row for a read that failed: what could not be checked, and Try again. */
const unreadRow=(what,cols)=>`<tr><td colspan="${cols}" class="empty">Could not check ${what} right now. ${AGAIN}</td></tr>`;
/** The home's CairnX activity: a ledger as the preview's latest transactions (the family label, the record in words, the
 *  transaction), with All, Names and DEX and a View all to the domain's ledger, its verdicts in the view's `book`.
 *  refresh(tip) reads it again: a record not shown before enters with the new block's row-in. */
function homeActivity(act,props,avgSecs,tipH,book){
  let tip=tipH, filt='all', acts=[], failed=props===FAILED;
  const seen=new Set();
  // /domain/:d/proposals is already newest-first (DESC by height); do NOT reverse
  const decode=(list)=>list.map((p)=>{ let rec=null; try{rec=JSON.parse(p.uri);}catch{ /* not JSON: no record kind, the row shows under all */ }
    const html=describeDomainRecord('cairnx:v1',p.uri,book.get(p.txid),p.height); return html?{p,html,name:!!(rec&&NAME_KINDS.has(rec.t))}:null; }).filter(Boolean);
  acts=failed?[]:decode(props);
  for(const a of acts) seen.add(a.p.txid);
  act.insertAdjacentHTML('beforeend','<div id="actnote"></div><div class="scroll-x"><table class="acts"><thead><tr><th>Kind</th><th>Record</th><th class="r">Transaction</th></tr></thead><tbody id="actfeed"></tbody></table></div>');
  // the filter and View all, once there is a record to filter
  const heading=()=>{ if($('.h-side',act)) return;
    $('h2',act).insertAdjacentHTML('beforeend',`<span class="h-side"><span class="h-tabs" role="group" aria-label="Filter"><button type="button" class="tab" data-f="all" aria-pressed="true">All</button><button type="button" class="tab" data-f="name" aria-pressed="false">Names</button><button type="button" class="tab" data-f="dex" aria-pressed="false">DEX</button></span><a href="#/domain/${encodeURIComponent('cairnx:v1')}">View all</a></span>`);
    act.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{act.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));filt=b.dataset.f;render();}); };
  // age from height distance (blocks target ~2min): honest "~" display, no per-row block fetch
  const hAgo=(hh)=>{ if(!hh||!tip||hh>tip) return ''; const a=ageOf(Math.round((tip-hh)*avgSecs)); return a==='now'?'now':'~'+a+' ago'; };
  // the record's family label leads its line; here it moves to its own column, out of a refused record's strike. The
  // rest is one line beside a block's (cut with an ellipsis, whole in its title), its verdict tag whole after it.
  const row=(a,entering)=>{ const r=el(`<tr class="actrow${entering?' feed-row':''}"><td class="k"></td><td class="act"><div class="act-line"><span class="act-t">${a.html}</span></div></td>
    <td class="r m"><a href="#/tx/${esc(a.p.txid)}" title="${esc(`block ${fmtInt(a.p.height)}${hAgo(a.p.height)?', '+hAgo(a.p.height):''}, by ${a.p.proposer}`)}">${hashHtml(a.p.txid,6)}</a></td></tr>`);
    const k=r.querySelector('td.act .kind'); if(k) r.firstElementChild.append(k);
    const t=r.querySelector('.act-t'), tag=t.querySelector(':scope > .cx-noeffect');
    if(tag) t.after(tag);
    t.title=t.textContent.trim();
    return r; };
  const render=(entering=new Set())=>{
    const feed=$('#actfeed',act); if(!feed) return;
    $('#actnote',act).innerHTML=acts.length?verdictLine(book):'';
    if(failed){ feed.innerHTML=unreadRow('the CairnX activity',3); return; }
    if(!acts.length){ feed.innerHTML='<tr><td colspan="3" class="empty">No CairnX records in this indexer yet.</td></tr>'; return; }
    heading();
    const list=acts.filter(a=>filt==='all'||(filt==='name'?a.name:!a.name)).slice(0,HOME_ROWS);
    if(list.length) feed.replaceChildren(...list.map((a)=>row(a,entering.has(a.p.txid)))); else feed.innerHTML='<tr><td colspan="3" class="empty">No records of this kind yet.</td></tr>';
    paintNames(feed); };
  render();
  return {
    async refresh(newTip){
      const list=await j('/domain/'+encodeURIComponent('cairnx:v1')+'/proposals').catch(()=>null);
      if(!Array.isArray(list)||!act.isConnected) return;
      // the new records' verdicts, and any not judged yet: one a block lands on may just have been
      await book.read(list.map((p)=>p.txid));
      if(!act.isConnected) return;
      if(newTip) tip=newTip;
      failed=false;
      acts=decode(list);
      const entering=new Set(acts.filter((a)=>!seen.has(a.p.txid)).map((a)=>a.p.txid));
      for(const id of entering) seen.add(id);
      render(entering);
    },
  };
}
async function home(v){
  void charts();   // the chart module loads alongside the reads, so the hashrate tile usually has its window when drawn
  // /health answers whenever the indexer runs, an empty index included: a failed read is the route's failed state
  const health=await j('/health');
  // each panel shows its own failed read; the figures without their read show a dash. An indexer without
  // /analytics/series (its 404) has no series; any other failure of it is a failed read.
  const [domains,supplyR,minersR,rich,cxprops,seriesR]=await Promise.all([
    soft('/domains'), soft('/analytics/supply'), soft('/analytics/miners?window=1d'), soft('/analytics/richlist?limit=8'),
    soft('/domain/'+encodeURIComponent('cairnx:v1')+'/proposals'),
    j('/analytics/series?window=1d&points=56').catch((e)=>isMiss(e)?null:FAILED)]);
  const supply=known(supplyR), miners=known(minersR), series=known(seriesR);
  const book=verdictBook();
  await Promise.all([warmCx(), cxprops===FAILED?null:book.read((cxprops||[]).map((p)=>p.txid))]);
  const recent=await recentBlocks();
  v.innerHTML='';

  // ── the chain at a glance ──
  const halvDays=supply?Math.round(supply.halving.est_seconds_remaining/86400):null;
  // hashrate: the indexer's Δchainwork ÷ Δtime over the window /dashboard shows, labelled with its real span
  const hr=miners&&miners.network_hashrate>0?fmtHashrate(miners.network_hashrate):null;
  const hrSpan=miners&&Number.isFinite(miners.from_height)?`Δchainwork ÷ Δtime over blocks ${fmtInt(miners.from_height)} to ${fmtInt(miners.to_height)}, from the indexer`:'';
  v.appendChild(el(`<div class="pulse">
    <div class="pu hot"><div class="l">Height</div><div class="n">${fmtInt(health.indexed_height)}</div></div>
    <div class="pu"><div class="l">Avg block time, 24h</div><div class="n">${miners?`${Math.round(miners.avg_interval_secs)} <span class="u">s</span>`:'-'}</div></div>
    <div class="pu" id="pu-hr" title="${esc(hrSpan)}"><div class="l">Hashrate<span data-hrwin="tile"></span></div><div class="n">${hr?`${hr.val} <span class="u">${hr.unit}</span>`:'-'}</div></div>
    <div class="pu"><div class="l">Circulating</div><div class="n">${supply?`${fmtCSD(supply.emitted_supply).replace(' CSD','')} <span class="u">CSD</span>`:'-'}</div></div>
  </div>`));
  if(!paintHrWin(v,miners,series)) charts().then(()=>{ if(v.isConnected) paintHrWin(v,miners,series); });

  // ── latest blocks and the recent CairnX activity, side by side, HOME_ROWS rows each so the columns end level ──

    <div class="panel ex-col"><h2>Latest blocks <span class="h-side" id="livepill"${STATUS.live?'':' hidden'}><span class="ui-dot ui-dot-live"></span><span class="lp-t">Live</span></span></h2>
      <div class="scroll-x"><table><thead><tr><th>Height</th><th>Age</th><th>Hash</th><th class="num opt-xs">Txs</th></tr></thead><tbody id="blkfeed" aria-live="polite"></tbody></table></div></div>
    <div class="panel ex-col" id="actcol"><h2>Recent CairnX activity</h2></div>
  </div>`);
  v.appendChild(cols);
  const tb=$('#blkfeed',cols);
  recent.slice(0,HOME_ROWS).forEach(b=>tb.appendChild(blockRow(b)));
  const activity=homeActivity($('#actcol',cols),cxprops===FAILED?FAILED:(cxprops||[]),(miners&&miners.avg_interval_secs)||120,health.indexed_height||0,book);
  // the same subscription that brings a new block reads the activity again
  subscribeBlocks(tb,(tip)=>activity.refresh(tip));

  // ── Section: CSD, the native coin (+ emission-schedule chart) ──
  const csdPanel=el(`<div class="panel"><h2>CSD <span class="h-side">The native coin</span></h2>
    <dl class="facts">
      <div><dt>Circulating</dt><dd>${supply?fmtCSD(supply.emitted_supply):'-'}</dd></div>
      <div><dt>Max supply</dt><dd>${supply?fmtCSD(supply.max_supply):'-'}</dd></div>

    <div class="muted">Emission schedule: 50 CSD/block, halving every 1,051,200 blocks (~4 years), secured by SHA-NI proof-of-work</div>
    <div id="emchart" class="xchart" hidden></div></div>`);
  v.appendChild(csdPanel);
  marketPanel($('#csd-mkt',csdPanel));
  // the schedule by year: a block height's date is projected from the newest block at the 120 s target
  (()=>{ const tip=recent[0]&&recent[0].time?recent[0]:{height:health.indexed_height||0,time:Math.floor(Date.now()/1000)};
    const at=(h)=>tip.time+(h-tip.height)*120, y0=new Date(at(0)*1000).getUTCFullYear(), y1=new Date(at(8*HALVE)*1000).getUTCFullYear();
    const pts=[[at(0),0]]; for(let y=y0+1;y<=y1;y++){ const t=Date.UTC(y,0,1)/1000; pts.push([t,emittedAt(Math.round((t-at(0))/120))/1e8]); }
    plot($('#emchart',csdPanel),pts,{kind:'area',label:'CSD emitted',range:'the emission schedule',format:(x)=>Math.abs(x)<0.5?'0':compactNum(x),
      extra:[refLine(pts,emittedAt(tip.height+1)/1e8)],

  })();

  // ── Section: tokens on CairnX (top 3 highlighted + searchable/collapsible full list) ──
  const tokPanel=el(`<div class="panel"><h2>Tokens on CairnX <span class="h-side" id="tok-count"></span></h2>
    <div id="tok-top" class="coins"></div>

    <div id="tok-rest-wrap" style="display:none">
      <input id="tok-search" class="tok-search" aria-label="Search tokens" placeholder="Search tokens by ticker or name" autocomplete="off"/>

    <div class="muted" id="tok-note"></div></div>`);
  v.appendChild(tokPanel);
  (async()=>{
    const tr=await sib(SIB.cairnx,'/tokens'), note=$('#tok-note',tokPanel);
    if(tr.state==='standalone'){ note.innerHTML='CairnX tokens render on the <a href="https://cairn-substrate.com/explorer">cairn front door</a> (this standalone view has no token resolver).'; return; }
    if(tr.state!=='ok'||!Array.isArray(tr.data)){ note.outerHTML=unreadLine('the CairnX tokens'); return; }
    const toks=tr.data;
    if(!toks.length){ note.textContent='No tokens on CairnX yet.'; return; }
    const names=sibData(await sib(SIB.cairnx,'/names'));
    $('#tok-count',tokPanel).textContent=`${toks.length} listed`;
    const tokCard=(t)=>{const pct=Number(t.supply)>0?Number(BigInt(t.minted)*100n/BigInt(t.supply)):0;
      return `<a class="coin" href="#/token/${esc(t.ticker)}"><span class="tk">${esc(t.ticker)}</span><span class="nm">${esc(t.name||'CairnX token')}, ${t.mint==='issuer'?'fixed supply':'open mint'}</span>
        <div class="meta"><span>minted <b>${fmtAmt(t.minted,t.decimals)}</b></span><span>max <b>${fmtAmt(t.supply,t.decimals)}</b></span></div>
        <div class="bar"><i style="width:${Math.max(2,pct)}%"></i></div></a>`;};
    $('#tok-top',tokPanel).innerHTML=toks.slice(0,3).map(tokCard).join('');
    const rest=toks.slice(3);
    if(rest.length){
      const wrap=$('#tok-rest-wrap',tokPanel),toggle=$('#tok-toggle',tokPanel);
      toggle.style.display=''; toggle.textContent=`Browse all ${toks.length} tokens`;
      toggle.onclick=()=>{const open=wrap.style.display!=='none';wrap.style.display=open?'none':'';toggle.setAttribute('aria-expanded',String(!open));toggle.textContent=(open?'Browse all ':'Hide ')+`${toks.length} tokens`;if(!open)$('#tok-search',tokPanel).focus();};
      const renderRest=(q)=>{const f=rest.filter(t=>!q||t.ticker.toLowerCase().includes(q)||String(t.name||'').toLowerCase().includes(q));

      renderRest(''); $('#tok-search',tokPanel).addEventListener('input',(e)=>renderRest(e.target.value.trim().toLowerCase()));

    $('#tok-note',tokPanel).innerHTML=`Every token is <b>CairnX</b>: records carried inside ordinary chain transactions (the Ordinals/Runes class). The chain carries a fill's payment and the CairnX resolver decides its delivery, so a paid fill can be refused (shown here as no effect). ${Array.isArray(names)?`<b>${fmtInt(names.length)}</b> .csd names registered. `:''}Trade at <a href="https://cairn-substrate.com/trade" target="_blank">/trade</a> · <a href="https://cairn-substrate.com/docs" target="_blank">docs</a>.`;
  })();

  v.appendChild(el(`<div class="row">
    <div class="panel"><h2>App activity, on-chain domains</h2><div class="scroll-x"><table><thead><tr><th>Domain</th><th class="num">Proposals</th></tr></thead>

    <div class="panel"><h2>Chain records</h2><div class="kv">
      <div>blocks indexed</div><div class="v">${fmtInt(health.blocks)}</div>

      <div>attestations</div><div class="v">${fmtInt(health.attestations)}</div>
      <div>top miner (24h)</div><div class="v">${miners&&miners.miners&&miners.miners[0]?addrLink(miners.miners[0].addr)+' <span class="dim">('+Math.round((miners.concentration.top1)*100)+'% of blocks)</span>':'-'}</div>
    </div></div>
  </div>`));

  // ── miners (24h) + top holders ──
  v.appendChild(el(`<div class="row">
    <div class="panel"><h2>Miners, 24h${miners?` <span class="h-side"><span>${fmtInt(miners.miner_count)} ${miners.miner_count===1?'miner':'miners'}</span>${miners.concentration?`<span title="Herfindahl-Hirschman index of block share, lower = more decentralised">HHI ${Math.round(miners.concentration.hhi*10000)}</span>`:''}</span>`:''}</h2>
      <div class="scroll-x"><table><thead><tr><th class="num">#</th><th>Miner</th><th class="num">Blocks</th><th class="opt num">Share</th></tr></thead><tbody>${
        minersR===FAILED?unreadRow('the miners',4):((miners&&miners.miners)||[]).slice(0,5).map((m,i)=>`<tr><td class="num dim">${i+1}</td><td>${addrLink(m.addr)}</td><td class="num">${fmtInt(m.blocks)}</td><td class="opt num dim">${(m.share*100).toFixed(1)}%</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No recent miners</td></tr>'}</tbody></table></div></div>
    <div class="panel"><h2>Top holders</h2>

  </div>`));

  // ── network hashrate (the indexer's series over the hero tile's window) and block times (the last ~30
  // blocks), through the chart module: front door only ──
  if(SIB.charts){
    const hp=series&&Array.isArray(series.points)?series.points.filter(p=>p.ghs!=null).map(p=>[p.t,p.ghs]):[];
    const cb=recent;   // newest-first; recentBlocks() already pulled 31 in one round-trip
    const iv=[]; for(let i=0;i<cb.length-1;i++){ if(cb[i].time&&cb[i+1].time) iv.push({h:cb[i].height,t:cb[i].time,dt:Math.max(0,cb[i].time-cb[i+1].time)}); }
    iv.reverse();   // oldest → newest, left → right
    // block times need not rise from one block to the next: such a block is drawn 1 s after the one before
    const bt=[]; for(const x of iv) bt.push([bt.length&&x.t<=bt[bt.length-1][0]?bt[bt.length-1][0]+1:x.t,x.dt]);
    const avg=iv.length?Math.round(iv.reduce((a,b)=>a+b.dt,0)/iv.length):null;
    const row=el(`<div class="row">
      <div class="panel"><h2>Network hashrate <span class="h-side" data-hrwin="pill" hidden></span></h2><div id="hrchart" class="xchart" hidden></div>
        <div class="muted">Δchainwork ÷ Δtime, ${hp.length} points · from this indexer</div></div>
      <div class="panel"><h2>Block times <span class="h-side">last ${iv.length} blocks</span></h2><div id="btchart" class="xchart" hidden></div>
        <div class="muted">Seconds between consecutive blocks · dashed line: the 120 s target${avg!=null?` · avg <b>${avg}s</b>`:''} <span id="btpick"></span></div></div>

    charts().then(()=>plot($('#hrchart',row),hp,{kind:'area',label:'network hashrate',range:paintHrWin(row,miners,series),format:(x)=>{const f=fmtHashrate(x*1e9);return f.val+' '+f.unit;},emptyText:seriesR===FAILED?'Could not load the hashrate series right now':'no hashrate series from this indexer'}));
    plot($('#btchart',row),bt,{label:'block interval',range:`last ${iv.length} blocks`,format:(x)=>Math.round(x)+' s',
      domain:{lo:0,hi:btTop(Math.max(240,2*(avg||0)))},extra:bt.length?[refLine(bt,120)]:[],emptyText:'not enough blocks yet',
      onCrosshair:(t)=>{ const i=bt.findIndex(p=>p[0]===t), s=$('#btpick',row); if(s) s.textContent=i>=0?`· block ${fmtInt(iv[i].h)}: ${iv[i].dt}s`:''; }});
  }
  paintNames(v);
}

// ── a token's trust badge: cairn's own list of the tokens it lists (/trade/verified-tokens.json, the file /trade reads, a
// display convenience) judged by /trade's trustLevel (cairn's /trade/discover.js), front door only. Read once a session
// once both answer; while either fails, or standalone, the page shows no badge rather than a verdict it could not read.
let TRUST=null;
function trustReader(){
  if(!SIB.trust) return Promise.resolve(null);
  return TRUST??=(async()=>{
    try{
      const [r,mod]=await Promise.all([fetch(SIB.trust.list),import(SIB.trust.level)]);
      const list=r.ok?await r.json():null;
      if(!list||typeof list!=='object'||typeof mod.trustLevel!=='function') throw new Error('no trust list');
      const verified=list.verified&&typeof list.verified==='object'?list.verified:{};
      const impersonated=new Set((Array.isArray(list.impersonated)?list.impersonated:[]).map((t)=>String(t).toUpperCase()));
      return (t)=>{ const tk=String(t.ticker||'').toUpperCase(), meta=Object.hasOwn(verified,t.ticker)?verified[t.ticker]:Object.hasOwn(verified,tk)?verified[tk]:null;
        // bound: the entry names this token's deploy (trustLevel calls an entry without a deployId verified for any deploy)
        return { level:mod.trustLevel({ticker:tk,meta,impersonated,live:t}), listed:!!meta,
          bound:!!meta&&!!meta.deployId&&String(meta.deployId).toLowerCase()===String(t.deployId||'').toLowerCase() }; };
    }catch{ TRUST=null; return null; }
  })();
}
// the design direction's trust badges, each with the sentence it stands for, and only where the sentence holds:
// Verified for an entry bound to this deploy, Unverified for a ticker the list does not name; any other answer (an
// entry without a deploy, a level this page does not know) shows no badge
function trustBadge(tr){
  if(tr.level==='verified'&&tr.bound) return [`<span class="badge ok">${ICON.check}Verified</span>`,'Listed by Cairn for this deploy. A display convenience, not a consensus claim.'];
  if(tr.level==='impersonator') return [`<span class="badge caution">${ICON.alert}Look-alike</span>`,tr.listed?'Same ticker as a listed token, different deploy. Anyone can deploy any ticker.'
    :'Its ticker reads like a listed or well-known token, and Cairn does not list it. Anyone can deploy any ticker.'];
  if(tr.level==='unverified'&&!tr.listed) return ['<span class="badge">Unverified</span>','Not listed. Check the deployer before you buy.'];
  return ['',''];
}

    <tbody>${holders.slice(0,50).map((h,i)=>`<tr><td class="num dim">${i+1}</td><td>${addrLink(h.a)}</td><td class="num">${fmtAmt(h.av.toString(),t.decimals)}</td>
