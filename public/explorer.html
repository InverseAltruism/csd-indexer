function blockRow(b,live){
  if(b.time) TIP_TIME=Math.max(TIP_TIME,b.time);   // keep the age reference current with the chain tip
  return el(`<tr class="${live?'feed-row':''}" data-h="${b.height}" data-hash="${b.hash}"><td class="mono">${link('/block/'+b.height,fmtInt(b.height))}</td>
    <td class="dim age" data-ts="${b.time||''}" title="${b.time?fmtDate(b.time):''}">${age(b.time)}</td><td class="mono">${blockLead(b.hash)}</td><td class="num opt-xs">${fmtInt(b.tx_count)}</td></tr>`);
}
async function recentBlocks(){
  // one round-trip (newest-first); 31 blocks feed the block list (12 shown), the emission chart's
  // newest block AND the block-times chart from a single fetch
  // only an indexer without /blocks/recent (its 404) is read block by block; any other failure is the view's failed
  // state (a rate limit would only get worse with 25 more reads)
  try{ const r=await j('/blocks/recent?limit=31'); if(Array.isArray(r)) return r; }catch(e){ if(!isMiss(e)) throw e; }
  // fallback for an indexer without /blocks/recent (older deploy / different host)
  const tip=await j('/blocks/tip/height');const out=[];
  for(let h=tip;h>tip-12&&h>=0;h--){const hash=await j('/block-height/'+h).catch(()=>null);if(!hash)continue;out.push(await j('/block/'+hash));}
  return out;
}
function subscribeBlocks(tb,onBlock){
  // Auto-refresh by POLLING /blocks/recent (real timestamps, deduped by height). This works regardless of
  // SSE / the front-door proxy, which does NOT forward the event-stream: the old EventSource-only feed
  // therefore never updated through cairn-subst.com/explorer, and it stamped streamed rows with the CLIENT
  // clock (Date.now()) so every live block read "0s ago". SSE, when reachable (standalone), just nudges a poll.
  const seen=new Map(); tb.querySelectorAll('[data-h]').forEach(r=>seen.set(+r.getAttribute('data-h'), r.getAttribute('data-hash')||''));
  let es=null,last=0;
  async function poll(){
    if(!tb.isConnected){ clearInterval(iv); try{es&&es.close();}catch{ /* already closed */ } return; }   // view navigated away → stop
    const now=Date.now(); if(now-last<1500) return; last=now;                        // debounce SSE bursts
    let rows; try{ rows=await j('/blocks/recent?limit='+HOME_ROWS); }catch{ return; }
    if(!Array.isArray(rows)) return;
    // NEW or CHANGED-hash (reorg) blocks, keyed on height+hash; oldest-first so prepends keep order
    const fresh=rows.filter(b=>b&&seen.get(b.height)!==b.hash).sort((a,c)=>a.height-c.height);
    for(const b of fresh){ const existing=tb.querySelector(`tr[data-h="${b.height}"]`); const nr=blockRow(b,true);
      if(existing){ existing.replaceWith(nr); }                                       // reorg: replace the orphaned row in place
      else { tb.prepend(nr); const hn=$('.pu.hot .n'); if(hn) hn.textContent=fmtInt(b.height); }   // new: prepend + keep the hero height live
      seen.set(b.height, b.hash); }
    while(tb.children.length>HOME_ROWS){ const lc=tb.lastChild; seen.delete(+lc.getAttribute('data-h')); tb.removeChild(lc); }
    if(fresh.length){
      document.querySelectorAll('[data-ts]').forEach(e=>{const t=+e.getAttribute('data-ts'); if(t)e.textContent=age(t);}); // re-age with the advanced TIP_TIME
      if(onBlock) void onBlock(Math.max(...rows.map((b)=>Number(b.height)||0)));
    }
  }
  const iv=setInterval(poll,12000);
  try{ es=new EventSource(API+'/stream/blocks');
    es.addEventListener('block',()=>poll());
    es.addEventListener('reorg',ev=>{try{const d=JSON.parse(ev.data);const p=$('#livepill');if(p){$('.lp-t',p).textContent='Reorg at block '+fmtInt(d.ancestor);p.classList.add('reorg');p.hidden=false;}}catch{ /* a malformed reorg event: the poll below still replaces the rows */ }});
  }catch{ /* no EventSource here: the 12 s poll keeps the feed current */ }
}

async function blockPage(v,id){
  const b = /^[0-9]+$/.test(id) ? await j('/block/'+await j('/block-height/'+id)) : await j('/block/'+id);
  // the next block by height: a 404 is the indexer's tip, a failed read shows no link
  const [txids,health,next]=await Promise.all([j('/block/'+b.hash+'/txids'),j('/health').catch(()=>null),
    j('/block-height/'+(Number(b.height)+1)).then((h)=>({hash:h}),(e)=>({tip:e&&e.status===404}))]);
  // confirmations from the indexer's own tip; the badge turns to "up" at the indexer's final depth
  const confs=health&&Number.isFinite(health.indexed_height)&&health.indexed_height>=b.height?health.indexed_height-b.height+1:null;
  const final=confs!=null&&Number.isFinite(health.final_depth)&&confs>=health.final_depth;
  v.innerHTML='';
  v.appendChild(el(`<div class="panel"><h2 class="ex-title">Block ${fmtInt(b.height)}${confs!=null?` <span class="badge${final?' ok':''}" id="blkconfs">${final?ICON.check:''}${fmtInt(confs)} ${confs===1?'confirmation':'confirmations'}</span>`:''}</h2>
    <div class="ex-detail"><div class="kv">
      <div>hash</div><div class="v mono">${hashHtml(b.hash)}${copyBtn(b.hash,'hash')}</div>
      <div>prev</div><div class="v">${b.prev?blockLink(b.prev):'-'}</div>
      <div>next</div><div class="v" id="blknext">${typeof next.hash==='string'&&/^0x[0-9a-f]{64}$/i.test(next.hash)?blockLink(next.hash):next.tip?'<span class="dim">None yet: this is the indexer\'s tip</span>':'<span class="dim">-</span>'}</div>
      <div>merkle root</div><div class="v mono">${esc(b.merkle)}</div>
      <div>time</div><div class="v">${fmtDate(b.time)} <span class="dim">· ${ago(b.time)}</span></div>
      <div>miner</div><div class="v mono" id="blkminer"><span class="dim">…</span></div>
    </div><div class="kv">
      <div>transactions</div><div class="v">${fmtInt(b.tx_count)}</div>
      <div>reward</div><div class="v" id="blkreward"><span class="dim">…</span></div>
      <div>difficulty</div><div class="v">${fmtDifficulty(difficultyOf(b.bits))} <span class="dim">· bits 0x${(b.bits>>>0).toString(16)}</span></div>
      <div>nonce</div><div class="v">${esc(b.nonce)}</div>
      <div>chainwork</div><div class="v">${compactNum(b.chainwork)}H <span class="dim">cumulative work</span></div>
    </div></div></div>`));
  // who mined it + what it paid (coinbase = first tx; display only)
  (async()=>{ const m=$('#blkminer'), rw=$('#blkreward'); if(!m||!rw) return;
    const cb=txids.length?await j('/tx/'+txids[0]).catch(()=>null):null;
    if(!cb||!cb.coinbase){ m.innerHTML=rw.innerHTML='<span class="dim">-</span>'; return; }
    const addr=cb.outputs&&cb.outputs[0]&&cb.outputs[0].addr;
    m.innerHTML=addrLinkG(addr)+(addr?copyBtn(addr,'address'):'');
    rw.textContent=fmtCSD((cb.outputs||[]).reduce((s,o)=>s+o.value,0));
    paintNames(m); })();
  v.appendChild(el(`<div class="panel"><h2>Transactions (${fmtInt(txids.length)})</h2><div class="scroll-x"><table><thead><tr><th class="num">#</th><th>Txid</th></tr></thead>
    <tbody>${txids.map((t,i)=>`<tr><td class="num dim">${i}</td><td>${txidLink(t)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No transactions</td></tr>'}</tbody></table></div></div>`));
}

async function txPage(v,id){
  await warmCx();
  // the proof's 404 is the indexer holding none; any other failure leaves inclusion unchecked, never "No proof"
  const [tx,status,proof]=await Promise.all([j('/tx/'+id),j('/tx/'+id+'/status').catch(()=>null),j('/tx/'+id+'/merkle-proof').catch((e)=>isMiss(e)?null:FAILED)]);
  v.innerHTML='';
  const typeBadge = `<span class="kind">${tx.app_type==='Propose'?'Propose':tx.app_type==='Attest'?'Attest':tx.coinbase?'Coinbase':'Transfer'}</span>`;

  // ── the title, what happened in human terms, then the details, as the preview's block heading ──
  const human=el(`<div class="panel"><h2 class="ex-title">Transaction ${typeBadge} <span id="inclbadge" class="badge pend">Verifying inclusion…</span></h2>
    <div class="action" id="txaction"><span class="dim">Decoding…</span></div>${flowHtml(tx)}
    <div class="kv">
      <div>txid</div><div class="v mono">${hashHtml(tx.txid)}${copyBtn(tx.txid,'transaction id')}</div>
      <div>block</div><div class="v">${link('/block/'+tx.height,fmtInt(tx.height))} ${status?`<span class="dim">· ${fmtInt(status.confirmations)} ${status.confirmations===1?'confirmation':'confirmations'}</span> ${status.final?`<span class="badge ok">${ICON.check}Final</span>`:'<span class="badge pend">Maturing</span>'}`:''}</div>
      <div>time</div><div class="v" id="txtime"><span class="dim">…</span></div>
      <div>position</div><div class="v">${esc(tx.pos)}</div>
      <div>signer</div><div class="v">${addrLinkG(tx.signer)}</div>
      <div>fee</div><div class="v">${fmtCSD(tx.fee)}</div>
      <div>inputs / outputs</div><div class="v">${esc(tx.n_in)} / ${esc(tx.n_out)}</div>
    </div></div>`);
  v.appendChild(human);
  (async()=>{
    const slot=$('#txaction',human);
    let line=null;
    if(tx.app_type==='Propose'){
      // precise per-record verdict for the detail page (authoritative even past a bounded log page)
      const [prop,vr]=await Promise.all([j('/proposal/'+tx.txid).catch((e)=>isMiss(e)?null:FAILED),sib(SIB.cairnx,'/record/'+tx.txid)]);
      const verdict=recordVerdict(vr);
      // a Propose whose proposal read failed is a proposal all the same, never "a plain chain transaction"
      if(prop===FAILED) line=`${kind('Record')}<span class="what">Proposal</span>${unreadLine('what it proposes')}`;
      else if(prop) line=(describeDomainRecord(prop.domain,prop.uri,verdict,prop.height)
        || `${kind('Record')}<span class="what">Anchored a proposal</span> in ${link('/domain/'+encodeURIComponent(prop.domain),prop.domain)}`)
        +(prop.domain==='cairnx:v1'?recordLine(vr):'');
    } else if(tx.app_type==='Attest'){
      // the attested proposal id lives in the tx app payload; ask the node (cairn front door only)
      const [nr,vr]=await Promise.all([sib(SIB.node,'/tx/'+tx.txid),sib(SIB.cairnx,'/record/'+tx.txid)]);
      const full=sibData(nr), pid=full&&full.tx&&full.tx.app&&full.tx.app.proposal_id;
      if(pid){
        const pidHex=pidHexOf(pid);
        const prop=await j('/proposal/'+pidHex).catch((e)=>isMiss(e)?null:FAILED);
        const score=full.tx.app.score;
        if(prop===FAILED) line=`${kind('Record')}<span class="what">Attestation</span>${unreadLine('what it attests')}`;
        else if(prop&&prop.domain==='cairnx:v1'){
          let rec=null; try{rec=JSON.parse(prop.uri);}catch{ /* not JSON: rec stays null, which describeOfferAttest handles */ }
          line=describeOfferAttest(tx,full.tx.app,pidHex,rec,recordVerdict(vr))+recordLine(vr);
        } else if(prop){
          line=`${kind('Record')}<span class="what">Attested</span> score ${esc(score)} on ${link('/proposal/'+pidHex,short(pidHex,10),'mono')} in ${link('/domain/'+encodeURIComponent(prop.domain),prop.domain)}`;
        }
      } else if(nr.state==='standalone') line=`${kind('Record')}<span class="what">Attestation</span> <span class="dim">(open via the cairn front door for full decoding)</span>`;
      // the node's read failed: an attestation all the same, never "a plain chain transaction"
      else if(nr.state==='failed') line=`${kind('Record')}<span class="what">Attestation</span>${unreadLine('what it attests')}`;
      else line=`${kind('Record')}<span class="what">Attestation</span>`;
    } else if(tx.coinbase){ line=`${kind('CSD')}<span class="what">Block reward</span>: new CSD minted to the miner`; }
    else {
      const me=(tx.signer||'').toLowerCase();
      const outs=(tx.outputs||[]).filter(o=>(o.addr||'').toLowerCase()!==me);
      line=`${kind('CSD')}<span class="what">${addrLink(tx.signer)} sent CSD</span>${outs.length===1?` to ${addrLink(outs[0].addr)}`:` to ${outs.length} recipients`}`;
    }
    // an app record whose details are absent is still that record
    slot.innerHTML=line||(tx.app_type==='Attest'?`${kind('Record')}<span class="what">Attestation</span>`:tx.app_type==='Propose'?`${kind('Record')}<span class="what">Proposal</span>`
      :'<span class="dim">A plain chain transaction</span>');
    paintNames(human);
  })();

  // when the tx was mined (one block-header lookup, display only)
  (async()=>{ const t=$('#txtime'); if(!t) return;
    const blk=await j('/block/'+await j('/block-height/'+tx.height).catch(()=>null)).catch(()=>null);
    t.innerHTML=blk&&blk.time?`${fmtDate(blk.time)} <span class="dim">· ${ago(blk.time)}</span>`:'<span class="dim">-</span>'; })();
  v.appendChild(el(`<div class="panel"><h2>Outputs</h2><div class="scroll-x"><table><thead><tr><th class="num">#</th><th>Address</th><th class="num">Value</th><th class="opt">Status</th></tr></thead>
    <tbody>${(tx.outputs||[]).map(o=>`<tr><td class="num dim">${esc(o.vout)}</td><td>${addrLink(o.addr)}</td><td class="num">${fmtCSD(o.value)}</td>
      <td class="opt">${o.spent_txid?`<span class="dim">Spent by ${txidLink(o.spent_txid)}</span>`:'<span class="dim">Unspent</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No outputs</td></tr>'}</tbody></table></div></div>`));
  if(proof===FAILED){ const b=$('#inclbadge'); b.innerHTML=`${ICON.x}Inclusion not checked: the proof read failed`; b.className='badge pend'; }
  else if(proof){
    v.appendChild(el(`<div class="panel"><h2>Merkle inclusion proof</h2>
      <div class="muted">This proof is served by an <i>untrusted</i> indexer, and so is the block header below. Your browser folds the branch and checks it equals the indexer's stated merkle root: a <b>consistency check</b> that the proof matches the header this same indexer reports. It is <b>NOT</b> a PoW/consensus proof: nothing here verifies the header's proof-of-work or that it is on the canonical chain. For a trustless inclusion proof, fold against a header obtained from the L0 light client (which checks PoW + checkpoints).</div>
      <div class="kv">
        <div>block height</div><div class="v">${fmtInt(proof.block_height)}</div>
        <div>position</div><div class="v">${esc(proof.pos)}</div>
        <div>merkle root</div><div class="v mono">${esc(proof.merkle_root)}</div>
        <div>branch (${proof.merkle.length})</div><div class="v">${proof.merkle.length?`<span class="mono">${proof.merkle.map((x)=>short(x)).join(' · ')}</span>`:'<span class="dim">None: a single-tx block</span>'}</div>
      </div></div>`));
    // Fold the branch against the block's merkle root. NOTE: that root comes from the SAME
    // untrusted indexer (no PoW/header verification here), so a matching fold proves only that
    // the proof is CONSISTENT with the header this indexer reports, not consensus inclusion.
    try{
      const blk=await j('/block/'+await j('/block-height/'+proof.block_height));
      const ok=await verifyInclusion(tx.txid,proof.pos,proof.merkle,blk.merkle);
      const b=$('#inclbadge');b.innerHTML=ok?`${ICON.check}Consistent with indexer header (not PoW-verified)`:`${ICON.x}Inclusion failed`;b.className='badge '+(ok?'ok':'bad');
    }catch(e){const b=$('#inclbadge');b.innerHTML=`${ICON.x}Inclusion not checked: ${esc(e.message)}`;b.className='badge bad';}
  } else {$('#inclbadge').textContent='No proof';$('#inclbadge').className='badge pend';}
}

async function addrPage(v,a){
  await warmCx();
  const [info,utxos,txs]=await Promise.all([j('/address/'+a),j('/address/'+a+'/utxo'),j('/address/'+a+'/txs')]);
  const s=info.chain_stats;
  v.innerHTML='';
  const lbl=labelOf(a);
  v.appendChild(el(`<div class="panel"><h2 class="ex-title">Address${lbl?` <span class="h-side">${esc(lbl)}</span>`:''}</h2><div class="kv">
    <div>address</div><div class="v mono">${addrGroups(a,true)}${copyBtn(a,'address')}</div>
    <div>balance</div><div class="v"><b>${fmtCSD(s.balance)}</b></div>
    <div>received</div><div class="v">${fmtCSD(s.funded)}</div>
    <div>spent</div><div class="v">${fmtCSD(s.spent)}</div>
    <div>tx count</div><div class="v">${fmtInt(s.tx_count)}</div>
    <div>UTXOs</div><div class="v">${fmtInt(utxos.length)}</div>
  </div><div class="kv" id="cxpanel" hidden></div></div>`));

  // ── CairnX holdings (token balances + .csd names), cairn front door only ──
  (async()=>{
    const r=await sib(SIB.cairnx,'/address/'+a), cxp=$('#cxpanel');
    if(r.state==='standalone'||r.state==='miss'||!cxp) return;
    if(r.state!=='ok'||!r.data||typeof r.data!=='object'){ cxp.innerHTML=`<div>tokens and names</div><div class="v">${unreadLine("this address's CairnX tokens and names")}</div>`; cxp.hidden=false; return; }
    const toks=Object.entries(r.data.balances||{});
    const names=Array.isArray(r.data.names)?r.data.names:[];
    if(!toks.length&&!names.length) return;
    // CairnX holdings as more of the address's rows: each token amount with its ticker (labelled base units when the
    // decimals were not read), each name a link to its page
    cxp.innerHTML=(toks.length?`<div>tokens</div><div class="v">${toks.map(([t,b])=>`<span>${amt(b.available,t)} ${link('/token/'+encodeURIComponent(t),t)}${Number(b.locked)?` <span class="dim">(+${amt(b.locked,t)} locked in offers)</span>`:''}</span>`).join('<span class="dim"> · </span>')}</div>`:'')
      +(names.length?`<div>names</div><div class="v">${names.map(n=>link('/name/'+encodeURIComponent(n),n+'.csd')).join('<span class="dim"> · </span>')}</div>`:'');
    cxp.hidden=false;
  })();

  // tx table with a human ACTION column + direction relative to THIS address.
  // Heading shows the TRUE total (chain_stats.tx_count), not the loaded-page length; pages append
  // via the Esplora keyset cursor (/txs/chain/:last), so a hot treasury/faucet address is no longer
  // capped at its latest 25 txs.
  const me=a.toLowerCase();
  const PAGE=25;
  v.appendChild(el(`<div class="panel"><h2>Transactions (${fmtInt(s.tx_count)})</h2><div id="txnote"></div><div class="scroll-x"><table class="stack"><thead><tr><th>Txid</th><th class="act">Record</th><th class="opt num">Block</th><th class="num">Amount</th></tr></thead>
    <tbody id="txrows"></tbody></table></div><div id="txmore"></div></div>`));
  let loaded=0, lastTxid=null;
  // the view's verdicts; every row shown, so a later read can word again a row whose verdict it answered
  const book=verdictBook(), rows=[], isRecord=(t)=>t.app_type==='Propose'||t.app_type==='Attest';
  const appendTxPage=async(page)=>{
    if(!Array.isArray(page)||!page.length){const m=$('#txmore'); if(m) m.innerHTML=loaded?'':'<div class="muted">No transactions</div>'; return;}
    const records=page.filter(isRecord), unread=rows.filter((r)=>book.unread(r.t.txid));
    // this page's verdicts and those of earlier rows still unread
    await book.read(records.map((t)=>t.txid));
    const note=$('#txnote'); if(note) note.innerHTML=records.length||rows.some((r)=>isRecord(r.t))?verdictLine(book):'';
    for(const r of unread) if(!book.unread(r.t.txid)) decodeTxRow(r.t,r.i);
    const start=loaded;
    $('#txrows').insertAdjacentHTML('beforeend',page.map((t,k)=>{const i=start+k;return `<tr><td>${txidLink(t.txid)}</td><td class="act" id="act-${i}"><span class="dim">${esc(t.app_type)}</span></td><td class="opt num">${link('/block/'+t.height,fmtInt(t.height))}</td><td id="dir-${i}" class="num dim">…</td></tr>`;}).join(''));
    loaded+=page.length; lastTxid=page[page.length-1].txid;
    page.forEach((t,k)=>{ rows.push({t,i:start+k}); decodeTxRow(t,start+k); });
    const more=$('#txmore');
    if(more) more.innerHTML=(page.length===PAGE&&loaded<s.tx_count)?`<button type="button" class="ex-btn" id="txloadmore">Load more (${fmtInt(loaded)} of ${fmtInt(s.tx_count)})</button>`:'';
    const btn=$('#txloadmore');
    if(btn) btn.onclick=async()=>{ btn.disabled=true; btn.textContent='Loading…';
      const next=await j('/address/'+a+'/txs/chain/'+lastTxid).catch(()=>FAILED);
      // a failed read is not the end of the list: the button stays, saying so
      if(next===FAILED){ btn.disabled=false; btn.textContent='Could not load more. Try again'; return; }
      await appendTxPage(next); };
  };

  // decode one row (each is a cheap local lookup)
  async function decodeTxRow(t,i){
    try{
      // rows carry outputs inline (indexer >= 0.2.5): no per-row /tx refetch; older responses fall back to one fetch
      const full=(t&&Array.isArray(t.outputs))?t:await j('/tx/'+t.txid);
      // direction: outputs to me − (if I signed: everything I paid)
      const recv=(full.outputs||[]).filter(o=>(o.addr||'').toLowerCase()===me).reduce((x,o)=>x+o.value,0);
      let delta;
      if((full.signer||'').toLowerCase()===me){
        const out=(full.outputs||[]).filter(o=>(o.addr||'').toLowerCase()!==me).reduce((x,o)=>x+o.value,0);
        delta=-(out+full.fee);
      } else delta=recv;
      const d=$('#dir-'+i);
      if(d) d.outerHTML=`<td class="num ${delta>=0?'green':'red'}">${delta>=0?'+':''}${fmtCSD(delta)}</td>`;
      if(full.app_type==='Propose'){
        const prop=await j('/proposal/'+t.txid).catch(()=>null);
        const line=prop&&(describeDomainRecord(prop.domain,prop.uri,book.get(t.txid),prop.height)||`${kind('Record')}proposal in ${esc(prop.domain)}`);
        const slot=$('#act-'+i); if(slot&&line) slot.innerHTML=line;
      } else if(full.app_type==='Attest'&&SIB.node){
        const nf=sibData(await sib(SIB.node,'/tx/'+t.txid));
        const pid=nf&&nf.tx&&nf.tx.app&&nf.tx.app.proposal_id;
        if(pid){const pidHex=pidHexOf(pid), prop=await j('/proposal/'+pidHex).catch(()=>null);
          if(prop&&prop.domain==='cairnx:v1'){let rec=null;try{rec=JSON.parse(prop.uri);}catch{ /* not JSON: rec stays null, which describeOfferAttest handles */ }
            const slot=$('#act-'+i);
            if(slot) slot.innerHTML=describeOfferAttest(full,nf.tx.app,pidHex,rec,book.get(t.txid));
          }}
      } else if(full.coinbase){const slot=$('#act-'+i); if(slot) slot.innerHTML=`${kind('CSD')}Block reward`;}
      else if(full.app_type==='Transfer'||full.app_type==='None'){const slot=$('#act-'+i); if(slot) slot.innerHTML=`${kind('CSD')}Transfer`;}
      paintNames($('#act-'+i));
    }catch{ /* a failed read leaves this row's placeholders; the other rows decode on their own */ }
  }

  await appendTxPage(txs);
}

// ── .csd name profile page (the name-service centerpiece), front-door only ──
async function namePage(v,label){
  label=String(label||'').toLowerCase().replace(/\.csd$/,'');
  if(!SIB.cairnx){ v.innerHTML='<div class="panel"><h2 class="ex-title">Name</h2><div class="muted">.csd name pages need the cairn front door (cairn-substrate.com/explorer). This standalone view has no name resolver.</div></div>'; return; }
  // the name's heading: its avatar, the name, a badge, a line under it
  const head=(av,badge,sub)=>`<div class="namehdr">${av}<div><h2 class="ex-title"><span class="nm-l">${esc(label)}<span class="dim">.csd</span></span>${badge}</h2>${sub}</div></div>`;
  if(!NAME_RE.test(label)){ v.innerHTML=`<div class="panel">${head(nameAvatar(label),'','<div class="muted">Not a .csd name: a name is 1 to 32 lowercase letters, digits and hyphens, and starts and ends with a letter or a digit.</div>')}</div>`; return; }
  const [r,av]=await Promise.all([sib(SIB.cairnx,'/name/'+encodeURIComponent(label)),avatarModule()]);
  v.innerHTML='';
  // the resolver's 404 for a valid label is its answer that nobody holds the name; any other failure says nothing
  if(r.state==='miss'){
    v.appendChild(el(`<div class="panel">${head(nameAvatar(label),'','<div class="muted">Not registered. <a href="https://cairn-substrate.com/names" target="_blank" rel="noopener">Register it on /names</a></div>')}</div>`));
    return;
  }
  // a name record has its owner's address; a 200 without one (ok:false, {} or []) is not the resolver's answer for a
  // name (it answers 404 for one nobody holds): it says nothing either
  if(r.state!=='ok'||!r.data||typeof r.data!=='object'||r.data.ok===false||!/^0x[0-9a-f]{40}$/i.test(String(r.data.owner||''))){
    v.appendChild(el(`<div class="panel">${head(nameAvatar(label),' <span class="badge caution">Could not check</span>',`<div class="muted ex-unread">Could not check this name right now, so it is not shown as available. ${AGAIN}</div>`)}</div>`));
    return;
  }
  const n=r.data, owner=n.owner, target=n.addr||n.owner, via=n.addr?'address record (nset)':'owner (no record set)';
  // the badge is the resolver's own primary pick for the owner (lapsed, locked and several self-pointing names
  // included), read per view
  const [pri,hist]=await Promise.all([owner?sib(SIB.cairnx,'/primary/'+encodeURIComponent(owner)).then(sibData):null,
    sib(SIB.cairnx,'/name-history/'+encodeURIComponent(label)),warmCx(),resolveNames([owner,target])]);
  const isPrimary=!!pri&&pri.name===label;
  // an address shown with its primary name only when that name is not this one: there it says something new
  const primaryOf=(a)=>{ const nm=a===owner&&pri&&typeof pri.name==='string'?pri.name:NAMECACHE.get(String(a||'').toLowerCase());
    return nm&&nm!==label?`<span class="chip">primary name ${link('/name/'+encodeURIComponent(nm),nm+'.csd')}</span>`:''; };
  const L=n.lease||{};
  const leaseLine = !L.leased ? '<span class="dim">No lease (legacy registration)</span>'
    : L.lapsed ? '<span class="red">Lapsed</span> · in recapture window'
    : L.inGrace ? `<span class="amber">In grace</span> · ~${epochsToHuman(L.graceEpochsLeft)} to recapture`
    : `<span class="green">Active</span> · ~${epochsToHuman(L.epochsLeft)} remaining`;
  // the name's heading and its record, as the preview's block heading and keys
  v.appendChild(el(`<div class="panel">${head(nameAvatar(label,av,owner),isPrimary?' <span class="badge">Primary</span>':'',
      `<div class="muted">${n.locked?'<span class="amber">Locked in an open offer</span>':'A .csd name on Compute Substrate'}${n.viaFill?' · acquired via a marketplace fill':''}</div>`)}
    <div class="ex-detail"><div class="kv">
    <div>owner</div><div class="v">${addrLinkG(owner,true)}${primaryOf(owner)}</div>
    <div>resolves to</div><div class="v">${addrLinkG(target,true)}${primaryOf(target)} <span class="dim">(${via})</span></div>
    </div><div class="kv">
    <div>lease</div><div class="v">${leaseLine}</div>
    <div>claimed</div><div class="v">block ${link('/block/'+n.height,fmtInt(n.height))} <span class="dim">· effective at block ${fmtInt(n.effectiveHeight)}</span></div>
  </div></div></div>`));
  const prof=n.profile||{}, pk=Object.keys(prof).filter(k=>prof[k]);
  if(pk.length) v.appendChild(el(`<div class="panel"><h2>Profile</h2><div class="kv">${pk.map(k=>`<div>${esc(k)}</div><div class="v">${esc(String(prof[k]))}</div>`).join('')}</div></div>`));
  if(n.offer){ const o=n.offer, price=o.want&&o.want.value!=null?fmtCSD(o.want.value):(o.want?`${amt(o.want.amount,o.want.ticker)} ${esc(o.want.ticker)}`:null);
    v.appendChild(el(`<div class="panel"><h2>For sale</h2><div class="action">${kind('Market')}<span class="what">Listed ${price?`for <b>${price}</b>`:'for sale'}</span>${o.taker?' · reserved (RFQ)':' · open offer'}</div>
      <div class="muted">Buy at <a href="https://cairn-substrate.com/names" target="_blank" rel="noopener">/names</a></div></div>`));
  }
  const h=sibData(hist), evs=((h&&Array.isArray(h.events)&&h.events)||[]).slice().reverse();
  if(hist.state==='failed') v.appendChild(el(`<div class="panel"><h2>History</h2>${unreadLine("this name's history")}</div>`));
  const book=verdictBook();
  await book.read(evs.slice(0,40).map((ev)=>ev.txid));
  if(evs.length) v.appendChild(el(`<div class="panel"><h2>History (${fmtInt(evs.length)})</h2>${verdictLine(book)}<div class="scroll-x"><table class="stack"><thead><tr><th class="act">Record</th><th>Tx</th><th class="num">Block</th></tr></thead>
    <tbody>${evs.slice(0,40).map(ev=>`<tr><td class="act">${cxVerdict(kindLabel(ev.kind,book.get(ev.txid)),book.get(ev.txid))}</td><td>${txidLink(ev.txid)}</td><td class="num">${ev.height?link('/block/'+ev.height,fmtInt(ev.height)):''}</td></tr>`).join('')}</tbody></table></div></div>`));
  paintNames(v);
}
// A domain's proposals, newest first: the indexer's newest 100, then 100 more a read (its limit, up to 10,000). The count
// is the domain's total from /domains; without it the heading says how many are shown.
const DOMAIN_PAGE=100, DOMAIN_MAX=10000;
async function domainPage(v,d){
  const path='/domain/'+encodeURIComponent(d)+'/proposals';
  const [first,doms]=await Promise.all([j(path),j('/domains').catch(()=>null)]);
  // a domain exists on the chain only through its proposals: none is a miss, as the search reads it
  if(!Array.isArray(first)||!first.length){ v.innerHTML=missPanel(d,`This indexer has no proposals in the domain \u201c${esc(d)}\u201d.`); return; }
  const known=Array.isArray(doms)?doms.find((x)=>x&&x.domain===d):null;
  const total=known&&Number.isFinite(Number(known.proposals))?Number(known.proposals):null;
  // verdicts are CairnX's: only its domain has them, each read also asks again for the rows still unread
  const cx=d==='cairnx:v1', book=verdictBook();
  await Promise.all([warmCx(), cx?book.read(first.map((p)=>p.txid)):null]);
  v.innerHTML='';
  v.appendChild(el(`<div class="panel"><h2 class="ex-title">Domain <span class="mono">${esc(d)}</span></h2>
    <div class="muted" id="domcount"></div><div id="domnote"></div>
    <div class="scroll-x"><table class="stack"><thead><tr><th>Proposal</th><th class="act">Record</th><th class="opt">Proposer</th><th class="opt num">Fee</th><th class="num">Height</th></tr></thead>
    <tbody id="domrows"></tbody></table></div><div id="dommore"></div></div>`));
  const shown=new Set(), list=[];
  let asked=DOMAIN_PAGE;
  const row=(p)=>`<tr><td><a class="mono" href="#/proposal/${esc(p.txid)}">${hashHtml(p.txid,10)}</a></td><td class="act">${describeDomainRecord(d,p.uri,book.get(p.txid),p.height)||'<span class="dim">-</span>'}</td><td class="opt">${addrLink(p.proposer)}</td><td class="opt num">${fmtCSD(p.fee)}</td><td class="num">${link('/block/'+p.height,fmtInt(p.height))}</td></tr>`;
  const paint=(page)=>{
    const fresh=page.filter((p)=>p&&!shown.has(p.txid));
    for(const p of fresh){ shown.add(p.txid); list.push(p); }
    const rows=$('#domrows',v); if(!rows) return;
    // every row drawn again: a read may have answered an earlier row's verdict
    rows.innerHTML=list.map(row).join('');
    $('#domnote',v).innerHTML=cx?verdictLine(book):'';
    $('#domcount',v).textContent=`${total!=null?`${fmtInt(total)} ${total===1?'proposal':'proposals'}`:`Latest ${fmtInt(shown.size)}`}. Rankings are a derived, recomputable view, not consensus-signed.`;
    const more=page.length>=asked&&asked<DOMAIN_MAX&&(total==null||shown.size<total);
    $('#dommore',v).innerHTML=more?`<button type="button" class="ex-btn" id="domloadmore">Load more (${fmtInt(shown.size)}${total!=null?` of ${fmtInt(total)}`:''})</button>`:'';
    const b=$('#domloadmore',v);
    if(b) b.onclick=async()=>{
      b.disabled=true; b.textContent='Loading…';
      const want=Math.min(DOMAIN_MAX,asked+DOMAIN_PAGE), next=await j(`${path}?limit=${want}`).catch(()=>null);
      if(!Array.isArray(next)){ b.disabled=false; b.textContent='Could not load more. Try again'; return; }
      asked=want;
      if(cx) await book.read(next.filter((p)=>p&&!shown.has(p.txid)).map((p)=>p.txid));
      paint(next); paintNames($('#domrows',v));
    };
  };
  paint(first);
}

async function proposalPage(v,id){
  await warmCx();
  const [p,vr]=await Promise.all([j('/proposal/'+id),sib(SIB.cairnx,'/record/'+id)]);
  v.innerHTML='';
  const human=describeDomainRecord(p.domain,p.uri,recordVerdict(vr),p.height);
  v.appendChild(el(`<div class="panel"><h2 class="ex-title">Proposal <span id="cibadge" class="badge pend">Checking content…</span></h2>${human?`<div class="action">${human}${p.domain==='cairnx:v1'?recordLine(vr):''}</div>`:''}<div class="kv">
    <div>txid</div><div class="v mono">${hashHtml(p.txid)}${copyBtn(p.txid,'transaction id')}</div>
    <div>domain</div><div class="v">${link('/domain/'+encodeURIComponent(p.domain),p.domain)}</div>
    <div>payload hash</div><div class="v mono">${esc(p.payload_hash)}</div>
    <div>URI</div><div class="v mono">${p.uri?esc(p.uri):'-'}</div>
    <div>proposer</div><div class="v">${addrLinkG(p.proposer)}</div>
    <div>fee</div><div class="v">${fmtCSD(p.fee)}</div>
    <div>expires</div><div class="v">epoch ${esc(p.expires_epoch)} <span class="dim">(~block ${fmtInt(Number(p.expires_epoch)*30)})</span></div>
    <div>attestations</div><div class="v">${fmtInt(p.attestation_count)}</div>
  </div></div>`));
  v.appendChild(el(`<div class="panel"><h2>Attestations (${(p.attestations||[]).length}) <span class="h-side">Per attester, not the on-chain aggregate</span></h2>
    <div class="scroll-x"><table><thead><tr><th>Attester</th><th class="num">Score</th><th class="num">Confidence</th><th class="num">Fee</th><th>Tx</th></tr></thead>
    <tbody>${(p.attestations||[]).map(a=>`<tr><td>${addrLink(a.attester)}</td><td class="num">${fmtInt(a.score)}</td><td class="num">${fmtInt(a.confidence)}</td><td class="num">${fmtCSD(a.fee)}</td><td>${txidLink(a.txid)}</td></tr>`).join('')||'<tr><td colspan=5 class="empty">None yet</td></tr>'}</tbody></table></div></div>`));
  await contentBadge($('#cibadge'),p.payload_hash);
}
// The proposal's content, from cairn's /content (same origin, front door only): served bytes are hashed here, as
// received, and only bytes whose sha256 equals the on-chain payload_hash read as verified. A mismatch is called one
// only when cairn's own X-CSD-Payload-Hash header names this hash; any other 200 (an edge error or challenge page,
// an app-shell fallback) is not cairn's answer, so it reads as unavailable.
async function contentBadge(badge,hash){
  const set=(text,cls,icon='')=>{ badge.innerHTML=icon+esc(text); badge.className='badge '+cls; };
  if(!SIB.content){ set('Content check needs the cairn front door','pend'); return; }
  if(!/^0x[0-9a-f]{64}$/i.test(String(hash))){ set('No content hash','pend'); return; }
  const want=hash.toLowerCase();
  let bytes, named;
  try{
    const r=await fetch(SIB.content+want);
    if(r.status===404){ set('Content not held by this front door','pend'); return; }
    if(!r.ok){ set('Content unavailable','pend'); return; }
    named=String(r.headers.get('X-CSD-Payload-Hash')||'').toLowerCase()===want;
    bytes=new Uint8Array(await r.arrayBuffer());
  }catch{ set('Content unavailable','pend'); return; }   // network error or an aborted body: nothing was checked
  if(bytesToHex(await sha256(bytes))===want) set('Content integrity verified','ok',ICON.check);
  else if(named) set('Content mismatch','bad',ICON.x);
  else set('Content unavailable','pend');
}

// ── the indexer's state: live (the latest-blocks heading says so), or a badge beside the search saying what is wrong ──
const STATUS={live:false};
function showStatus(live,cls,text,title){
  STATUS.live=live;
  const s=$('#stats');
  s.hidden=live;
  s.innerHTML=live?'':`<span class="badge ${cls}" title="${esc(title)}"><span class="ui-dot"></span>${esc(text)}</span>`;
  const lp=$('#livepill'); if(lp&&!lp.classList.contains('reorg')) lp.hidden=!live;
}
async function refreshStats(){
  let h;
  // a 429 is the front door limiting this connection and an answer that is not JSON is no indexer's: neither says the
  // indexer is down. A 5xx (the front door could not reach it) or no answer at all does.
  try{ h=await j('/health'); }catch(e){
    if(e&&e.status===429) showStatus(false,'caution','Too many requests','the front door is limiting reads from this connection; the page asks again in 15 s');
    else if(e&&(e.status>=500||e.status==null&&e instanceof TypeError)) showStatus(false,'bad','Indexer offline','the indexer did not answer its /health read');
    else showStatus(false,'caution','Could not check',`the indexer's /health read gave no answer this page can read (${e&&e.message||'no answer'}); asked again in 15 s`);
    return; }
  const ss=h.seconds_since_tip, lag=Math.max(0,(h.tip_height||0)-(h.indexed_height||0));
  const fresh=!h.stale&&lag<2&&(ss==null||ss<180);
  // A real indexer LAG (indexed_height < node tip, catching up) is distinct from a merely OLD tip (the indexer is AT
  // the tip but blocks are slow, e.g. low hashrate): the latter is labelled as the newest block's age, not as the
  // indexer being behind.
  if(lag>=2) showStatus(false,'caution',`${fmtInt(lag)} blocks behind`,`the indexer is catching up to the node (${lag} blocks)`);
  else if(fresh) showStatus(true);
  else { const behind=ss==null?null:ss<60?`${ss} s`:ageOf(ss);
    showStatus(false,'caution',behind?`Last block ${behind} ago`:'Syncing',`the indexer is at the tip; the newest block is ${behind||'of unknown'} age (slow blocks or low hashrate)`); }
}
refreshStats();setInterval(refreshStats,15000);
setInterval(()=>document.querySelectorAll('[data-ts]').forEach(e=>{const t=+e.getAttribute('data-ts'); if(t)e.textContent=age(t);}),10000);  // tick relative times
route();
</script>
